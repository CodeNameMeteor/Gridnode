name: build

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reflection walker test (sanitizers)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=undefined -g \
            -Isdk/include tests/reflect_walker_test.cpp sdk/src/reflect/walker.cpp sdk/src/reflect/dump_json.cpp \
            -o reflect_walker_test
          ./reflect_walker_test
      - name: Install PyYAML
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: gridnode-gen tests and annotation check
        run: |
          python3 -m unittest discover -s tools/gen/tests -t tools/gen -v
          python3 tools/gen/gridnode.py validate --strict
      - name: Rust bindings are up to date, and a Rust mod works through the C ABI
        run: |
          python3 tools/gen/gridnode.py rust --check
          cargo build --release --manifest-path examples/hello-rust/Cargo.toml
          gcc -std=c11 -Wall -Wextra -Werror -Isdk/include tests/rust_mod_harness.c -o rust_mod_harness -ldl
          ./rust_mod_harness examples/hello-rust/target/release/libhello_rust.so
      - name: CMake build and ctest (Linux, fixture dump)
        run: |
          cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release \
            -DGRIDNODE_REFLECTED=$PWD/tools/gen/tests/fixture/reflected.json \
            -DGRIDNODE_ANNOTATIONS=$PWD/tools/gen/tests/fixture/annotations
          cmake --build build-linux
          ctest --test-dir build-linux --output-on-failure

  windows-mingw:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 and PyYAML
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 ninja-build python3-yaml
      - name: Configure and build (x64, Release)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc-posix \
            -DCMAKE_BUILD_TYPE=Release \
            -DGRIDNODE_BUILD_TESTS=OFF
          cmake --build build
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: gridnode-x64-mingw
          path: |
            build/gridnode.dll
            build/version.dll
            build/gridnode_inject.exe
            build/mods/*.dll

  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        shell: pwsh
        run: |
          python -m pip install pyyaml
          "PY=$((Get-Command python).Source)" >> $env:GITHUB_ENV
      - name: Configure, build and test (MSVC x64, Release, fixture dump)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $fx = "${{ github.workspace }}/tools/gen/tests/fixture"
          cmake -S . -B build -A x64 "-DPython3_EXECUTABLE=$env:PY" "-DGRIDNODE_REFLECTED=$fx/reflected.json" "-DGRIDNODE_ANNOTATIONS=$fx/annotations" 2>&1 | Tee-Object -FilePath ci.log
          if ($LASTEXITCODE -eq 0) { cmake --build build --config Release 2>&1 | Tee-Object -FilePath ci.log -Append }
          if ($LASTEXITCODE -eq 0) { ctest --test-dir build -C Release --output-on-failure 2>&1 | Tee-Object -FilePath ci.log -Append }
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Annotations are readable through the checks API even when the raw log is not.
            Select-String -Path ci.log -Pattern "error|failed|FAILED|Error" | Select-Object -First 40 | ForEach-Object { "::error::$($_.Line.Trim())" }
          }
          exit $code
      - name: Rust example mod (MSVC x64)
        shell: pwsh
        run: cargo build --release --manifest-path examples/hello-rust/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Upload the Rust example mod
        uses: actions/upload-artifact@v4
        with:
          name: hello-rust-x64-msvc
          path: examples/hello-rust/target/x86_64-pc-windows-msvc/release/hello_rust.dll
