functions:
  - name: VisibilitySystem_update
    va: 0x14357b970
    signature: "void(void* system, u32 handle, const f32* sphere)"
    confidence: inferred
    sources: [ghidra]
    note: "Moves a culling sphere {centre xyz, radius}: locks, writes, marks the entry dirty. Called by RigidMeshEntity_setTransform (0x14376c060) with the render object's +0x84 handle."
  - name: StaticModelGroup_placementHash
    va: 0x143b722e0
    signature: "void(u8* out16, void* assetMinus10, const LinearTransform* world)"
    confidence: inferred
    sources: [ghidra]
    note: "Hashes a mesh asset (asset - 0x10, when its +10 u16 has 0x100; else null) with the quantised position, rotation and scale; the 16 bytes go in a group member's render update at +0x78. See docs/research/render-objects.md."
  - name: ClientStaticModelGroup_makeMemberObject
    va: 0x143185940
    signature: "void(void* block, void* group, void* a3, u32 copy, void* a5)"
    confidence: inferred
    sources: [ghidra]
    note: "Fills a stack update template (render world, factory value at +0x8a, flags) and calls 0x1431841f0, which makes the copy's RigidMeshEntity, sets the view mask (+0x8c), placement hash (+0x78) and submits it."
  - name: ClientStaticModelGroup_placeMember
    va: 0x14318fbc0
    signature: "void(void* block, const LinearTransform* group, u32 firstPart)"
    note: >-
      Places one member's render objects: per copy, InstanceTransforms[i] (or the physics part
      transform) times the group transform; object vtable +0x10 sets it, RenderObject_buildUpdate
      and RenderWorld_submitUpdate push it. Called per member by the group's transform-changed
      function (0x143193690), which passes this function's (void) result as the next member's first
      part, so GridNode does not call that function.
    confidence: inferred
    sources: [research]
  - name: RenderObject_buildUpdate
    va: 0x143769330
    signature: "void(void* object, u8* update)"
    confidence: inferred
    sources: [research]
  - name: RenderWorld_submitUpdate
    va: 0x1436d6ce0
    signature: "void(void* renderWorld, u8* update)"
    confidence: inferred
    sources: [research]
  - name: ClientStaticModelEntity_bounds
    va: 0x1431833a0
    signature: "void(void* entity, void* out)"
    note: "Vtable +0xb8: out+0x00 its world transform (4 rows), out+0x40 / +0x50 its local box (min, max). Computes the box when bit 0 of +0x142 is set and caches it at +0x100 / +0x110 (clearing the bit). Client thread."
    confidence: inferred
    sources: [ghidra]
  - name: MeshStreaming_setTransform
    va: 0x143555450
    signature: "void(void* manager, u32* handle, const LinearTransform* transform, f32 value)"
    note: "Sets a streaming instance's position (the mesh box's centre in the transform) and a value kept at +0x1c (0x1435556a0 with a count of 1). The game passes the float at 0x1419fd590; RigidMeshEntity_setTransform already calls it, so callers moving a render object should not."
    confidence: inferred
    sources: [ghidra]
  - name: RigidMeshEntity_setTransform
    va: 0x14376c060
    signature: "void(void* object, const LinearTransform* world)"
    note: >-
      Vtable +0x10 of RigidMeshEntity (vtable 0x141bf72c8), a static model's render object. Stores
      the transform at +0x10 (four float4 rows) and the world bounding sphere at +0x50, from the
      mesh's local box at *(**(object + 0x60) + 0x20) (min xyz, pad, max xyz). The layout editor's
      outline reads both (docs/research/render-objects.md; fit confirmed in game 2026-10-21).
    confidence: inferred
    sources: [ghidra, research]
