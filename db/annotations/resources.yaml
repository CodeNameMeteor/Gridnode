constants:
  - { name: ResourceGroup_Count, value: 0xbbd, note: "Also the 'none' id." }

structs:
  - name: Partition
    size: 0x30
    note: In-memory partition container holding reflected DataContainers and blueprints.
    members:
      - { offset: 0x00, name: vtable, type: "void*", note: "Partition vtable pointer." }
      - { offset: 0x08, name: partitionGuid, type: "u8[16]", note: "16-byte asset partition GUID." }
      - { offset: 0x18, name: name, type: "const i8*", note: "Partition resource name string." }
      - { offset: 0x20, name: instances, type: "void**", note: "Array of reflected DataContainer pointers in the partition." }
      - { offset: 0x28, name: instanceCount, type: "u16", note: "Count of instances stored in the partition." }

  - name: PartitionMapNode
    size: 0x18
    note: Singly linked bucket node in compartment hash map (+0x158).
    members:
      - { offset: 0x00, name: path, type: "const i8*", note: "Lowercase hashed resource path string." }
      - { offset: 0x08, name: partition, type: "Partition*", note: "Loaded Partition pointer." }
      - { offset: 0x10, name: next, type: "PartitionMapNode*", note: "Next bucket node in the singly linked list." }
