# Names from the user's Ghidra project (GridNodeSync, 2026-10-20): hypotheses until checked.
defaults: { confidence: hypothesis, sources: [ghidra] }

globals:
  - name: ResourceGroups
    va: 0x14237deb8
    type: "void*[0xbbd]"
    confidence: inferred
    sources: [ghidra, gridnode]
    note: "Resource groups (compartments) by id; 0xbbd means none. Group +0x62: the parent id (lookups fall back to it, 0x142abb350); +0x68: its database domain; +0x158: partitions by name."
  # From the user's Ghidra project (GridNodeSync, 2026-10-20); hypotheses until checked.
  - name: g_platformInfo
    va: 0x142564920
    type: "u64"
    note: "Labelled in Ghidra as g_platformInfo."
    confidence: hypothesis
    sources: [ghidra]

functions:
  # Finding a loaded asset by name (M7; checked in Ghidra 2026-10-20). As the sound system does
  # for SoundSettings' asset (0x1432bd0e0): partition = Partition_findByName(getCompartment(0), path);
  # asset = Partition_primaryInstance(partition); addRef (+8, u16); ... DataContainer_release(asset).
  - name: getCompartment
    va: 0x142abad00
    signature: "void*(u16 id)"
    confidence: hypothesis
    sources: [ghidra, gridnode, research]
    note: "The compartment of resource group id: ResourceGroups[id] +0x68, returned through a thunk (jmp [0x1447d2ab8]); null if the group does not exist. 0 is the static compartment. Confirmed in Ghidra decompilation."
  - name: Partition_findByName
    va: 0x142aeb310
    signature: "void*(void* compartment, const i8* path)"
    confidence: hypothesis
    sources: [ghidra, gridnode, research]
    note: "Case-insensitive (djb2-xor of the lower-cased path via 0x142aeb940; map at compartment +0x158, locked by +0xc0). Null if the partition is not loaded. Confirmed in Ghidra decompilation."
  - name: Partition_primaryInstance
    va: 0x142aec640
    signature: "void*(void* partition)"
    confidence: hypothesis
    sources: [ghidra, gridnode, research]
    note: "**(partition + 0x20): the partition's first (primary) instance, e.g. the Blueprint of a blueprint asset or the RigidMeshAsset of a mesh asset. Confirmed in Ghidra decompilation."
  - name: Partition_findByGuid
    va: 0x142aeb230
    signature: "void*(void* partitionPlus8, const void* guid)"
    confidence: hypothesis
    sources: [ghidra, research]
    note: "Searches a partition's instance array by 16-byte asset GUID. Called with partition + 8."
  - name: PartitionMap_find
    va: 0x142aeb940
    signature: "void*(void* partitionMap, void* outNodePair, const i8* path)"
    confidence: hypothesis
    sources: [ghidra, research]
    note: "Lowercase DJB2-XOR hash lookup in compartment +0x158 bucket array. Returns found node or end bucket node."
  - name: DataContainer_release
    va: 0x142a91cd0
    signature: "u32(void* container)"
    confidence: hypothesis
    sources: [ghidra, gridnode, research]
    note: "Drops a reference (u16 at +8, atomic); destroys the container at zero. The matching add is a locked increment of +8."
