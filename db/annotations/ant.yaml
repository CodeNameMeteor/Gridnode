# Names from the user's Ghidra project (GridNodeSync, 2026-10-20): hypotheses until checked.
defaults: { confidence: hypothesis, sources: [ghidra] }

functions:
  - name: RayCastCollisionProcessor_update
    va: 0x142ce8200
    signature: "void(void* asset, void* updateInfo)"
    note: >-
      The fall check (Ant RayCastCollisionProcessorAsset, vtable 0x141a62ee0, slot 4): ground contact
      from the RayCastBus hits; on contact DistanceFromLastGroundHeight = 0, else it adds dt x the
      downward speed; HasFallenPastThreshold = -FallThreshold (+0x40, f32, 10 m in the constructor) >
      distance (written at 0x142ce864c). The animation graph does the death fall from that flag. From
      the cinematic tools' research (Research_Ground_Level_2026-11-01 2.2); checked in Ghidra 2026-11-03.
    confidence: confirmed
    sources: [research, ghidra]
  - name: ServerWriteAntGameStateEntity_onEvent
    va: 0x1433acd90
    signature: "void(void* entity, void* event)"
    note: "Starts writing (0xc072adf0) or writes once (WriteOnce, 0xde2f4c9f) through the entity's updater (0x1433b09e0 -> 0x1431f7d10 -> each data object's vtable +0x18)."
    confidence: inferred
    sources: [ghidra]
  - name: WriteBoolGameState_write
    va: 0x14342db30
    signature: "void(void* data, void* props, u32* writerIndex, u32* valueIndex, void* state)"
    note: "Vtable +0x18 of WriteBoolGameState (and its siblings): reads the value slot (TypedValue_getValuePtr) and calls the ANT writer's +8 (writer, state, value). The Recorder wraps the +0x18 slot of each Write*GameState class."
    confidence: inferred
    sources: [ghidra]
