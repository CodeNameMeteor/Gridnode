# The gateway backend's uploads (2026-11-02, for the MEC trainer's upload block). The backend's
# message handler (gatewayBackend_handleMessage) runs each request as a JSON-RPC call; two message
# listeners lead to it. Message type ids at message +0xc (djb2-xor of the class name):
#   0x685f689d UploadNamedChallengeStatsRequest  "PamplonaAuthenticated.finish" {challengeId, mainStat, runId}: a Dash time
#   0x39c9a83d UploadStatsRequest                "PamplonaAuthenticated.finish" {ugcId, finishTime, splitTimes, replayUploadTicket}: a time trial time
#   0xb70b72ba UploadReplayRequestMessageBase    the run's ghost
#   0xaa067849 SetPlayerGhostRequest             the ghost shown to others
#   0x16545a7c UploadSharedContentRequest        "PamplonaAuthenticated.create": publishing a time trial (not a time)
#   0x5aa5342c UploadUserStatsRequest            "PamplonaAuthenticated.updatePersonaStats"
hooks:
  - name: GatewayBackendListener_onMessage
    kind: vtable-slot
    vtable: 0x141c68780
    offset: 0x0
    original: 0x1439ff670
    signature: "void(void* listener, void* message)"
    note: "A message listener (vtable {onMessage, order 0x142a3ad20}): mov rcx,[rcx+0x20]; xor r8d,r8d; jmp gatewayBackend_handleMessage."
    confidence: inferred
  - name: GatewayRouteListener_onMessage
    kind: vtable-slot
    vtable: 0x141c50d48
    offset: 0x0
    original: 0x1439715c0
    signature: "void(void* listener, void* message)"
    note: "A message listener: category 0x3010e025 (PamGatewayBackend) goes to the backend through 0x143a02030 (gatewayBackend_handleMessage under its lock); category 0x3c80003d elsewhere."
    confidence: inferred

code:
  - name: NamedChallengeFinish_statsCall
    va: 0x143a8f522
    note: "call NamedChallengeStats_onFinished in PamServerNamedChallengeEntity_finish (e8 rel32): the MEC trainer patches it to keep a new best from being saved."
