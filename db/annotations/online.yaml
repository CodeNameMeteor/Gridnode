  - name: NamedChallengeStats_onFinished
    va: 0x1439deb10
    signature: "void(void* dashState, void* challengeData, void* times, u32 runId)"
    note: >-
      A Dash finished (only call: PamServerNamedChallengeEntity_finish at 0x143a8f522). dashState is
      the global DashState (0x14257c9d0); times a vector of i64, [0] the main stat. Per player index
      (+0x10 bytes: active) it queues the online upload (UploadNamedChallengeStatsRequest, index 1),
      compares the main stat with the best in the map at +0x38 + i*0x30 (keyed by the challenge's
      stat name, challengeData +0x58; value at node +0x10; StatHigherIsBetter at data +0x28 -> +0x98),
      and on a new best writes it and the extra stats, appends each change {name, player, old, new}
      to the pending list at +0x220 and sets +0x218 (saved later). Then sends
      PamSocialPlayNamedChallengeFinishedMessage and PamSocialPlayNamedChallengeStatsUploadedMessage.
    confidence: inferred
    sources: [ghidra, recording]
