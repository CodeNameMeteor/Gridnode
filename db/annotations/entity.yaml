  # Entity events (from the first recording, 2026-10-20; docs/research/recording-teleport.md).
  - name: EntityBus_fireEvent
    va: 0x14314e4a0
    signature: "void(void* bus, void* sourcePeer, void* event)"
    note: >-
      Sends an event from a peer through its bus: walks the bus data's event connections (+0x68 ->
      +0x120, or +0x148 when bus+0x3c bit 28) for the source and event id (event +8), sets the
      target event id and delivers each (EntityBus_deliverEvent). Event ids are djb2-xor hashes of
      the event names ("Out" = 0xb87df4b). The list holds pointers to the 0x20-byte EventConnections
      records of the blueprint (+0x00 Source, +0x08 Target, +0x10 source event hash, +0x14 target event
      hash, +0x18 target type); a type-4 record is not delivered here, types 4 and 5 are passed to the
      bus interface's vtable +0x28 instead. The event's +8 is put back at the end.
    confidence: confirmed
    sources: [ghidra, recording]
  - name: EntityBus_deliverEvent
    va: 0x14314eac0
    signature: "void(void* bus, void* connection, void* event)"
    note: "To the bus's interface (+0x10) or to the target peer from the bus's peer table (+0x40), via EntityBusPeer_sendEvent. A connection to the blueprint's interface (target == bus +0x68 -> +0xb8 -> +0x28) fires the event in the parent bus (+0x10, minus 8) from source bus +0x60 (low two bits masked): how a blueprint's output leaves it. Other targets: a binary search of the template's peer-target list (+0xd0, or +0xf8 when bus +0x3c bit 28) picks the index into the bus's peer table, event +0xc = 1."
    confidence: confirmed
    sources: [ghidra]
  - name: EntityBusPeer_sendEvent
    va: 0x143134460
    signature: "void(i32 realm, void* peer, void* event)"
    note: "Calls the peer's vtable +0x20 (its onEvent) on the right thread, or queues it for that realm (0x143127d20)."
    confidence: confirmed
    sources: [ghidra]
  - name: EntityBusTemplate_ctor
    va: 0x1431417a0
    signature: "EntityBusTemplate*(EntityBusTemplate* self, void* realmFlag, void* allocator, void* blueprint)"
    note: >-
      Builds a bus template (0x170 bytes, allocated by its factory 0x143147010): the base DataBusTemplate
      (0x142a82b50), then EntityBusData_buildEventLists twice (client, server) into the sorted event lists
      at +0x120 / +0x148 and the peer-target lists at +0xd0 / +0xf8. The template is cached by
      BusTemplate_getOrBuild (0x142a82130; per realm a map at 0x14236e420 + 0x70 * (realm - 1), a lock
      at +0x40, refcount at template +0xc4, evicted by 0x142a86070 when a bus is destroyed).
    confidence: confirmed
    sources: [ghidra]
  - name: EntityBusData_buildEventLists
    va: 0x143153a50
    signature: "void(EntityBusTemplate* tmpl, void* arena, i32 realm, void* eventList, void* peerTargets)"
    note: >-
      Sorts the blueprint's EventConnections (data +0x38, count at ptr - 4, 0x20-byte records) by (Source,
      source event) into eventList, skipping type 3 for realm 0 and type 2 for realm 1, and collects the
      distinct Targets of those records and of the LinkConnections (data +0x20, 0x18-byte records) into
      peerTargets (sorted DataContainer pointers).
    confidence: confirmed
    sources: [ghidra]
  - name: ServerEventSync_onReachedClient
    va: 0x143364ba0
    signature: "void(void* listener, const Message* message)"
    note: >-
      Server handler of EventSyncReachedClientMessage (type id 0x458f8b20) sent by a client when it
      reaches an event sync point (e.g. confirming fast travel on the map): finds the sync entity by
      the message's ids (+0x48, +0x50, +0x60) and fires its "Out" event.
    confidence: inferred
    sources: [ghidra, recording]
  - name: SpatialEntity_setTransform
    va: 0x1432eb1f0
    signature: "void(void* entity, const LinearTransform* transform, u8 notify)"
    note: >-
      Sets a spatial entity's world transform. If entity+0x18 bit 21 is set it goes through vtable
      +0xf0 instead; if bit 3 is set it notifies through vtable +0xe0. Game thread only.
  # Destroying an entity (2026-10-21): unlink it from its owner (Entity_OwnerLink), then vtable
  # +0x88 (deinit), +0x30 (destroy), +0x38 (delete). Without the unlink the owner destroyed it again
  # when its part of the level unloaded (the game closed silently).
  # Without the deinit the components stay registered in the world (the spatial grid queried by
  # 0x1436d1dd0 then calls into freed memory: crashed in game).
  - name: SpatialEntity_deinit
    va: 0x1432e3b80
    signature: "void(void* entity, EntityDeinitInfo* info)"
    note: >-
      Vtable +0x88 of spatial entities, the counterpart of init (+0x78): if flags bit 23, +0x1a8
      (components' +0xd0: out of the world); +0x1b0 (the class's own teardown: physics, the client
      context's list); clears info.removeFromManager; then the base deinit 0x143175390 (unregisters
      from the bus, flag 4; clears the initialised flag 8).
    confidence: inferred
    sources: [ghidra, game]
  - name: SpatialEntity_destroy
    va: 0x1432e3c10
    signature: "void(void* entity)"
    note: >-
      Vtable +0x30 of spatial entities (ServerStaticModelEntity, ClientStaticModelEntity and many
      more): sets the destroyed flag (+0x18 |= 0x2000000) and destroys the entity's components
      (ComponentEntity_destroyComponents), which takes away its physics and render parts. The
      object stays allocated until vtable +0x38 deletes it. Game thread of the entity's realm.
    confidence: inferred
    sources: [ghidra]
  - name: ComponentEntity_destroyComponents
    va: 0x1431634a0
    signature: "void(void* entity)"
    note: "For each component in the collection at +0x38 (u8 slot count at +8, 0x20-byte slots from +0x10; a slot's component at +0x10, and slot byte +3 + 1 is how many slots it takes): vtable +0x30 (destroy), then +0x38 with 1 (delete); clears the count. Checked in the decompiler (2026-11-04); the Field diff window walks it."
    confidence: inferred
    sources: [ghidra]
  - name: Entity_dtor
    va: 0x143117610
    signature: "void(void* entity)"
    note: "Base destructor (end of every entity's +0x38): frees the peer data at +0x28 and releases the entity's bus (+0x20) with EntityBus_release. An entity holds a reference to its bus, so a bus is freed once its entities are gone."
    confidence: inferred
    sources: [ghidra]
