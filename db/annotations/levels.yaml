  - name: ClassInfo_nextSubclass
    va: 0x143164f80
    signature: "const TypeInfo*(const TypeInfo* root, const TypeInfo* at)"
    note: "Walks the class tree under root, depth first: first child (+0x30), else the next sibling (+0x38) of at or of its supers (+0x18) up to root. The game's loops over a class's entities use it with ClassInfo_firstInWorld. Read in Ghidra 2026-11-12."
