    va: 0x143164d50
    signature: "void*(const TypeInfo* type, const void* world)"
    note: "The first entity node of a class in a world: type + (world +0x28 + 6) * 0x10 (GameWorld_ClassListIndex: the world's realm, 0 client, 1 server). No null check of world. The list holds entities of exactly that class: the game's loops go on through ClassInfo_nextSubclass."
