functions:
  - name: ZoneStreamerFocus_add
    va: 0x143c7e7c0
    signature: "void(void* focusManager, u64 a2, void* focus)"
    note: "Appends a focus record (grows the list with 0x143c813f0). A ZoneStreamerFocusEntity calls it on Enable (0x8ba423e4 as i32 -0x745bdc1c) with (streamer + 0x280, 0, entity + 0x40)."
    confidence: inferred
    sources: [ghidra]
  - name: ZoneStreamerFocus_remove
    va: 0x143c81390
    signature: "void(void* focusManager, u64 a2, void* focus)"
    note: "Marks the matching record removed (bit 0 of +0x14); dropped by 0x143c7f570 in the next update. Writes out of bounds when no record matches: mark the record yourself once found."
    confidence: inferred
    sources: [ghidra]
  - name: ZoneStreamer_update
    va: 0x143c81900
    signature: "void(void* streamer, void* updateInfo)"
    note: "Per frame: focus positions (0x143c81850: each record's focus->vtable[0] into +0x2a8), each one's zone (0x143c82060), dropping removed records (0x143c7f570), zone loads and unloads."
    confidence: inferred
    sources: [ghidra]
  - name: ServerSubLevelEntity_onEvent
    va: 0x14335efb0
    signature: "void(void* subLevel, void* event)"
    note: >-
      ServerSubLevelEntity vtable +0x20. StreamIn (0xd27bc17e) and 0xce6d3f44 load the sublevel,
      StreamOut (0x21f3f677) unloads it; other events go on to its bus (+0x88). The event's vtable
      +0x10 is called on it (a copy for the pending queue). The layout editor wraps this slot to keep
      sublevels holding copies' sources loaded (docs/research/render-objects.md, PLAN M7 14).
    confidence: inferred
    sources: [ghidra, research]
