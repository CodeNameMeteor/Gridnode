    signature: "void(void* node, const TypeInfo* type, void* entity)"
    note: "Links an entity into its class's list in its realm, if its flags (+0x18) have 0x10: head = type + ((flags & 1) + 6) * 0x10 (the realm bit: what GameWorld_ClassListIndex holds). node = {next, pointer to the previous link}, inserted at the head. 163 callers, each passing a node at its own class's offset in the entity (characters +0x40, AI groups +0x30, splines +0x110, zone streamers +0x268). GridNode walks these lists to find the entities made before it loaded (inspector.cpp). Read in Ghidra 2026-11-12."
