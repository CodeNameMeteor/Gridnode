    note: "Controls zone streaming within a district sublevel. Evaluates focus positions to load and unload zones. The vtable once annotated here (0x141cfe4c0) is not one of the class's reflected vtables (0x141c6e2e8, 0x141cfe290); the reflected ones are used. Whether 0x141cfe4c0 is a secondary table is open."
