  - { name: Camera_setTransforms, va: 0x14332bc40, signature: "void(CameraObject* camera, void* transforms)", note: "Writes the camera's two transforms (+0x10, +0x50); called from FPSCamera_update.", confidence: inferred, sources: [ghidra] }
  - { name: ClientCameraViewManagers_frameUpdateAll, va: 0x14327b940, note: "Each frame, each view manager's frame update; called from ClientWorld_tickFrame.", confidence: inferred, sources: [ghidra] }
  - { name: FPSCamera_computeTransforms, va: 0x14327fb80, signature: "void(void* camera, void* info, LinearTransform* out)", note: "FPSCamera vtable +0x70 (slot 0x141b18ec8). Writes two transforms (camera, camera mesh) that FPSCamera's update (+0x68) stores at camera +0x10/+0x50. MECMP's third person moves both.", confidence: inferred, sources: [mecmp, ghidra] }
  - { name: FreeCamera_computeTransforms, va: 0x14332d780, signature: "void(void* camera, void* info, void* out)", note: "FreeCamera vtable +0x70 (slot 0x141b18ce8): copies transform (+0x10..+0x9f) to output.", confidence: inferred, sources: [ghidra] }
  - { name: FreeCamera_setTransforms, va: 0x14332bbd0, signature: "void(void* camera, void* transforms)", note: "Writes FreeCamera's two transforms (+0x10, +0x50) and zeroes velocity (+0x90).", confidence: inferred, sources: [ghidra] }
  - { name: ClientCameraViewManager_updateModifiers, va: 0x14327e850, signature: "void(void* self, LinearTransform* outMatrix, f32 deltaSec, f32 unused)", note: "Iterates active camera modifiers/shakes tree (+0x220) and computes worldBasisMatrix at +0x10f0 (starts at identity Y-up).", confidence: inferred, sources: [ghidra] }
