    signature: "void(void* manager, const LinearTransform* t, f32 fovDegrees, u8 a, u8 b)"
    note: "Copies t to +0x40, fovDegrees to +0x80, sets +0x84 (and +0x85, +0x86 from a, b). Only caller 0x1439438b0. postSimUpdate clears +0x84 each frame (0x14327c5d2), so an override is set again every frame."
