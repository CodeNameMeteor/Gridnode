# ANT's runtime: the type registry and layouts, the move tracker, the movement pipeline, driver and
# processor factories, the 16 subsystems. From the user's ANT handbook (2026-11-05) and Ghidra; every
# address checked to be a function start of that name in the user's Ghidra (2026-11-05). See
# docs/research/ant.md. The asset definitions themselves are in ant.yaml.
defaults: { confidence: inferred, sources: [ghidra, research] }

globals:
  - name: AntTypeRegistryPtr
    va: 0x1423bd9b0
    type: "void*"
    note: "g_antTypeRegistry: the registry object (name map at +0x00: begin, end; id map at +0x28). Set when the core subsystem starts."
    confidence: confirmed

functions:
  - name: ant_TypeRegistry_getTypeByName
    va: 0x142c2d4b0
    signature: "void*(void* registry, const char* name)"
    note: "Binary search of the registry's name map (sorted 16-byte entries {u32 FNV-1 hash, pad, Schema*}) for ant_hashString_fnv1(name); returns the Schema (its first word is the type's layout) or null. GridNode's ant_types.cpp does the same."
    confidence: confirmed
  - name: ant_TypeRegistry_registerType
    va: 0x142c352b0
    signature: "void*(void* registry, const char* name, const AntFieldDescriptor* fields, u32 count, void* factory, bool pack)"
    note: "Hashes the name (unique), makes a 0x10-byte Schema {layout, factory} with ant_registerSchema, adds it to the name map (registry +0x00) and the id map (registry +0x28, keyed by the layout's CRC at +0x1c)."
    confidence: confirmed
  - name: ant_TypeRegistry_getRegistry
    va: 0x142c2f840
    signature: "void*()"
    note: "Returns g_antTypeRegistry (0x1423bd9b0)."
    confidence: confirmed
  - name: ant_registerSchema
    va: 0x142c0c3c0
    signature: "void(void* schema, const char* name, const AntFieldDescriptor* fields, u32 count, void* factory, bool pack)"
    note: "Prepends __guid (-3), __name (-2) and __base (-1) to the fields and builds the layout (ant_createClassLayout)."
    confidence: confirmed
  - name: ant_createClassLayout
    va: 0x142fb0d60
    signature: "void*(void* allocator, const char* name, const AntFieldDescriptor* fields, u32 count)"
    note: "Allocates the layout (size from 0x142fb0980) and fills it (ant_buildClassLayout)."
    confidence: confirmed
  - name: ant_buildClassLayout
    va: 0x142fb0f00
    signature: "void*(void* layout, const char* name, const AntFieldDescriptor* fields, u32 count, bool pack, u32 alignment)"
    note: "Header: +0 min index, +4 max index, +8 data size, +0xc alignment, +0x10 string table offset, +0x14 its size, +0x18 pack flag, +0x1c CRC-32 (the type id). Records of 0x20 bytes from +0x20 (0x142fb1880): +0 field type id, +4 element size, +8 offset in the data, +0xc name offset, +0x10 count, +0x12 flags, +0x14 alignment, +0x18 the field type's layout. The string table starts with a 0, then the type's name."
    confidence: confirmed
  - name: ant_layoutFields
    va: 0x142fb1880
    signature: "void(void* layout, const char* name, const AntFieldDescriptor* fields, u32 count, bool pack)"
    note: "Fills the field records and assigns offsets by alignment (packed when the flag is set: offsets are not in declaration order) and writes the names."
    confidence: confirmed
  - name: ant_computeSchemaCrc32
    va: 0x142fb0800
    signature: "u32(const void* layout)"
    note: "CRC-32 over each record (type id, offset, count, flags, element size, alignment), the string table, the index range and the alignment: the type id at layout +0x1c."
    confidence: confirmed
  - name: ant_initFieldDescriptor
    va: 0x142faf9e0
    signature: "AntFieldDescriptor*(AntFieldDescriptor* out, i32 index, const char* name, const void* typeLayout, u32 flags, u32 count)"
    note: "The 0x20-byte descriptor: +0 index, +4 count (at least 1), +8 name, +0x10 type layout, +0x18 flags. (The handbook called +4 alignment and +0x18 offset: the layout pass uses them as count and flags.)"
    confidence: confirmed
  - name: ant_hashString_fnv1
    va: 0x143fbc460
    signature: "u32(const char* s, u32 seed, i32 mode)"
    note: "FNV-1 (h = h x 0x1000193 ^ c), seed 0x811c9dc5 for type names; mode 1 / 2 map each byte through a table first (case folding)."
    confidence: confirmed
  - name: ant_crc32
    va: 0x143fbbb70
    signature: "u32(const void* data, u32 size, u32 crc)"
    note: "Table-driven CRC-32."
    confidence: inferred
  - name: ant_TypeRegistry_assertUniqueName
    va: 0x142c3cf50
    signature: "void(void* registry, u32 hash)"
    note: "Breaks (int3) when the name hash is already registered."
    confidence: confirmed
  - name: ant_TypeRegistry_assertUniqueId
    va: 0x142c3cee0
    signature: "void(void* registry, u32 id)"
    note: "Breaks (int3) when the type id is already registered."
    confidence: inferred
  - name: PamMoveTracker_readAntValues
    va: 0x144795f00
    signature: "void(void* readers, void* out, void* state)"
    note: "Reads the move tracker's six ANT values into out: +0 CurrentMove, +4 DamageType, +0x10 MovePosition, +0x20 MoveNormal, +0x30 MovingSpeedXZ, +0x34 IsInJumpState (the component's +0x90..)."
    confidence: confirmed
  - name: PamClientMoveTrackerComponent_update
    va: 0x1439189e0
    signature: "void(void* component, const f32* dt)"
    note: "Publishes the read values at +0x60.. (current move, speed, distance moved, in jump state) and counts moves (+0x170); every 30 s the counters go to telemetry."
    confidence: confirmed
  - name: PamMovement_processAntState
    va: 0x142da0890
    note: "From the user's ANT handbook (2026-11-05): evaluates the movement mode from the state readAntState filled and the jump action. Name from the user's Ghidra; behaviour not checked here."
    confidence: hypothesis
  - name: PamMovement_applyMovementTrajectory
