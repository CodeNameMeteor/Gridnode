    note: "The data registry itself (DataRegistry_addListener's first argument as the game passes it): +0x00 a sorted (slot << 16 | class id) -> count vector, +0x30 the address tree (DataRegistry_TreeHead), +0x60 the object table (DataRegistry_Entries), +0x88 the listeners. Read in Ghidra 2026-11-13."
  - name: DataRegistry_Entries
    va: 0x142105510
    type: "void*"
    confidence: inferred
    sources: [ghidra]
    note: >-
      Every loaded data object (blueprints, entity data, assets of every bundle loaded): a vector {begin, end
      +8, capacity +0x10} of 16-byte {u64 key, DataContainer*} sorted by key = slot << 40 | class id << 16 |
      index (class id: the u16 at the object's TypeInfo + 0x28, from vtable slot 0; slot: the bundle's registry
      slot). Filled by DataRegistry_register, under DataRegistry_Lock. Was "JumpTuningRoot" (faith.yaml):
      the trainer's jump path read entry 164 (+0xa48), a PamCharacterBlueprint only in the usual load order.
      Read in Ghidra 2026-11-13 (DataRegistry_register's binary search and insert).
