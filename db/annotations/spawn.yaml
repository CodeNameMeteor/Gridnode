# Spawning characters: spawner entities, creators, creation info.
defaults: { confidence: confirmed, sources: [mecmp, research] }

classes:
  - name: ServerSpawnEntity
    realm: server
    note: Members observed on ServerCharacterSpawnEntity; their offsets fall in ServerSpawnEntity's range.
    confidence: inferred
    members:
      - { offset: 0x28, name: bus, type: "void*", note: "EntityBus (refcount at +0x30)." }
      - { offset: 0x30, name: data, type: "SpawnReferenceObjectData*", note: "For character spawners: CharacterSpawnReferenceObjectData." }
      - { offset: 0xf4, name: spawnCounter, type: u32, note: "Bus id of the next spawn = counter & 0x7f." }
      - { offset: 0x148, name: spawnedBegin, type: "void**", note: "vector<character*> of what this spawner spawned (last = newest)." }
      - { offset: 0x150, name: spawnedEnd, type: "void**" }
      - { offset: 0x2a4, name: enabled, type: bool }

  - name: ServerCharacterSpawnEntity
    realm: server
    vtable: 0x141b4e0c8
    virtuals:
      - { offset: 0xd0, name: spawn, va: 0x143390830, signature: "void*(SpawnInfo* info)", note: "Spawns at info->transform. Server game thread." }
      - { offset: 0x108, name: unspawn, va: 0x14338e4c0, signature: "void(void* character, bool destroy, void* a4)", note: "ServerCharacterSpawnEntity_unspawn." }
      - { offset: 0x120, name: update, va: 0x143391d70, signature: "void(void* updateInfo)", confidence: inferred }

  - name: PamServerCharacterSpawnEntity
    realm: server
    vtable: 0x141c4b388
    note: Every character spawner in the city is one of these (993 created when the city loads).
    virtuals:
      - { offset: 0xd0, name: spawn, va: 0x143390830, signature: "void*(SpawnInfo* info)" }
      - { offset: 0x108, name: unspawn, va: 0x14338e4c0, signature: "void(void* character, bool destroy, void* a4)" }

  - name: ClientSpawnEntity
    realm: client
    vtable: 0x141b10de8
    confidence: inferred
    note: "The client side of a spawner (ClientSpawnEntity_ctor)."
    members:
      - { offset: 0xb0, name: spawnedBegin, type: "void**", confidence: confirmed, note: "vector<character*> of the characters this spawner has (last = newest). Watched in game 2026-10-29: changes with the server list." }
      - { offset: 0xb8, name: spawnedEnd, type: "void**", confidence: confirmed }
      - { offset: 0xd0, name: lastSpawnedBus, type: "void*", note: "The last character's bus (+0x28), or 0." }
      - { offset: 0x140, name: listenersBegin, type: "void**" }
      - { offset: 0x148, name: listenersEnd, type: "void**" }
    virtuals:
      - { offset: 0xd8, name: addSpawned, va: 0x143239bb0, signature: "bool(void* character)", note: "ClientCharacterSpawnEntity overrides it (onCharacterSpawned)." }
      - { offset: 0xe0, name: removeSpawned, va: 0x143234e20, signature: "void(void* character)", confidence: confirmed }

  - name: ClientCharacterSpawnEntity
    realm: client
    vtable: 0x141b2ac20
    note: "0x170 bytes, created by ClientCharacterSpawnEntity_create; vtable +0xd8 is ClientCharacterSpawnEntity_onCharacterSpawned (ClientSpawnEntity_addSpawned in the base)."

structs:
  - name: SpawnInfo
    size: 0x70
    align: 16
    note: Argument of ServerCharacterSpawnEntity::spawn (same layout on PS4).
    members:
      - { offset: 0x00, name: transform, type: LinearTransform }
      - { offset: 0x40, name: player, type: "void*" }
      - { offset: 0x48, name: existing, type: "void*" }
      - { offset: 0x50, name: unk50, type: "void*" }
      - { offset: 0x58, name: unk58, type: i32, note: "-1" }
      - { offset: 0x5c, name: busId, type: i32, note: "-1: allocate" }
      - { offset: 0x60, name: unk60, type: u8, note: "1" }
      - { offset: 0x61, name: useTransform, type: u8 }

  - name: EntityCreationInfo
    size: 0x140
    opaque: true
    note: Passed to entity factories (creator vtable +8). The constructor touches up to +0x128.
    members:
      - { offset: 0x10, name: bus, type: "void*" }
      - { offset: 0x20, name: realm, type: i32, note: "1 for server creation." }
      - { offset: 0x28, name: kind, type: i32, note: "2 for character spawns." }
      - { offset: 0x30, name: team, type: u8, note: "0xff: none." }
      - { offset: 0x40, name: transform, type: LinearTransform }
      - { offset: 0xd0, name: data, type: "EntityData*", note: "The data of the entity being created (a spawner's CharacterSpawnReferenceObjectData)." }
      - { offset: 0xd8, name: existing, type: "void*" }
      - { offset: 0xf0, name: world, type: "void*" }

hooks:
  - name: ServerCharacterSpawnEntity_factory
    kind: creator-slot
    slot: 0x141b4f720
    original: 0x1433820c0
    signature: "void*(void* creator, EntityCreationInfo* ci, void* a3, void* a4)"
    note: Creator vtable 0x141b4f718 +8. Never fires in the city (all spawners there are Pam ones).
  - name: PamServerCharacterSpawnEntity_factory
    kind: creator-slot
    slot: 0x141c4b5c0
    original: 0x143957610
    signature: "void*(void* creator, EntityCreationInfo* ci, void* a3, void* a4)"
    note: Sees every character spawner as it is created; ci->data is the spawner's data (Blueprint at +0x18).

functions:
  - name: Entity_requestDestroy
    va: 0x143167700
    signature: "void(void* entity, void* ownerRef)"
    note: >-
      Asks the entity's owner to destroy it: returns if entity +0x18 bit 10 is set (already going),
      else jumps to [ownerRef]'s vtable +0x10 with the entity (the owner queues it). How the game
      removes characters: a spawner's Unspawn (0x143383f48) and the AI coordinator's despawn
      (0x143933580), both with ownerRef = [character +0x28]. Research_Spawn_System_2026-10-23;
      checked in Ghidra 2026-11-03.
    confidence: confirmed
    sources: [research, ghidra]
  - name: ServerCharacterSpawnEntity_createCharacter
    va: 0x143390a30
    signature: "void*(ServerCharacterSpawnEntity* spawner, SpawnInfo* info)"
    confidence: inferred
    note: Blueprint = vtable +0x138 override, else spawnerData+0x18. Wraps generic blueprint instantiation.
  - name: ServerSpawnEntity_getLastSpawnedCharacter
    va: 0x143381080
    signature: "void*(ServerSpawnEntity* spawner)"
    confidence: inferred
  - name: EntityBus_create
    va: 0x143146e90
    signature: "void*(void* owner, void* parentBus, void* referenceData, u32 id, u64 a5, u64 a6)"
    confidence: inferred
  - name: EntityBus_addRef
    va: 0x144122ca0
    signature: "void(void* bus)"
  - name: EntityBus_release
    va: 0x1431547b0
    signature: "void(void* bus)"
    note: "Drops a reference; at zero, unlinks the bus from its parent, frees it and releases the parent. It does not destroy the bus's entities: each holds a reference and releases it in its destructor (Entity_dtor), so releasing the bus of a live entity frees it under that entity."
  - name: ServerEntityCreationInfo_ctor
    va: 0x14335cab0
    signature: "void(EntityCreationInfo* ci, void* data, void* bus, const LinearTransform* transform)"
    confidence: inferred
    note: >-
      Base ctor with the physics query manager and realm 1; stores the transform at +0x40 and
      `data` at +0xd0 (the entity data to create). Used with entityCreator_spawnIntoBus by
      spawnSingleEntityFromSublevelData (0x142ca6260).
  - name: ClientEntityCreationInfo_ctor
    va: 0x1431c03b0
    signature: "void(EntityCreationInfo* ci, void* data, void* bus, const LinearTransform* transform)"
    confidence: inferred
    sources: [research]
    note: Base ctor with ClientGameWorld and realm 0. Used by the client static model group when a part is destroyed (0x143190730).
  - name: Entity_init
    va: 0x1431661c0
    signature: "void(void* entity, void* initInfo)"
    confidence: inferred
    sources: [research]
    note: "Returns if the entity's flags (+0x18) have 0x8 (already initialised); else vtable +0x78 (or +0x90 with flag 0x40)."
  - name: ServerEntityInitInfo_ctor
    va: 0x14335cb50
    signature: "void(void* info, u64 a2, u64 a3)"
    confidence: inferred
    sources: [research]
    note: "0x30 bytes: vtable 0x141b477a8, a2, a3, 0, u32 1, u8 1 (+0x24), u8 1 (+0x28). levelSublevel_spawnEntityGroup builds one per entity it spawned and calls Entity_init."
  - name: ClientEntityInitInfo_ctor
    va: 0x1431c0460
    signature: "void(void* info)"
    confidence: inferred
    sources: [research]
    note: "0x30 bytes: vtable 0x141b01f58, 0, 0, 0, u32 0, u8 1 (+0x24), u16 1 (+0x28)."
  - name: ClientEntity_spawnBlueprint
    va: 0x1431c4830
    signature: "void*(void* result, EntityCreationInfo* ci, void* blueprint, u64 a4, u64 a5)"
    confidence: inferred
    sources: [research]
    note: "Spawns a blueprint (creates a bus for it); result[0] is the root entity, result[2] (+0x10) a bus reference to release. Not for plain entity data (crashed)."
  - name: ClientEntity_spawnIntoBus
    va: 0x1431c44b0
    signature: "void*(EntityCreationInfo* ci, void* parentBus)"
    confidence: inferred
    sources: [research]
    note: "Client counterpart of entityCreator_spawnIntoBus: creates the entity for ci->data (+0xd0). Used by the client static model group for destroyed parts."
  - name: Blueprint_instantiate
    va: 0x14335e390
    signature: "void(void* result, EntityCreationInfo* ci, void* blueprint, void* referenceData, u64 a5)"
    confidence: inferred
    note: No-op unless BlueprintInstantiationEnabled is set.
