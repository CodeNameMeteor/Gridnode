    size: 0x70
    align: 16
    note: Argument of ServerCharacterSpawnEntity::spawn (same layout on PS4).
    members:
      - { offset: 0x00, name: transform, type: LinearTransform }
      - { offset: 0x40, name: player, type: "void*" }
      - { offset: 0x48, name: existing, type: "void*" }
      - { offset: 0x50, name: unk50, type: "void*" }
      - { offset: 0x58, name: unk58, type: i32, note: "-1" }
      - { offset: 0x5c, name: busId, type: i32, note: "-1: allocate" }
      - { offset: 0x60, name: unk60, type: u8, note: "1" }
      - { offset: 0x61, name: useTransform, type: u8 }

  - name: EntityCreationInfo
    size: 0x140
    opaque: true
    note: Passed to entity factories (creator vtable +8). The constructor touches up to +0x128.
    members:
      - { offset: 0x10, name: bus, type: "void*" }
      - { offset: 0x20, name: realm, type: i32, note: "1 for server creation." }
      - { offset: 0x28, name: kind, type: i32, note: "2 for character spawns." }
      - { offset: 0x30, name: team, type: u8, note: "0xff: none." }
      - { offset: 0x40, name: transform, type: LinearTransform }
      - { offset: 0xd0, name: data, type: "EntityData*", note: "The data of the entity being created (a spawner's CharacterSpawnReferenceObjectData)." }
      - { offset: 0xd8, name: existing, type: "void*" }
      - { offset: 0xf0, name: world, type: "void*" }

hooks:
  - name: ServerCharacterSpawnEntity_factory
    kind: creator-slot
    slot: 0x141b4f720
    original: 0x1433820c0
    signature: "void*(void* creator, EntityCreationInfo* ci, void* a3, void* a4)"
    note: Creator vtable 0x141b4f718 +8. Never fires in the city (all spawners there are Pam ones).
  - name: PamServerCharacterSpawnEntity_factory
    kind: creator-slot
    slot: 0x141c4b5c0
    original: 0x143957610
    signature: "void*(void* creator, EntityCreationInfo* ci, void* a3, void* a4)"
    note: Sees every character spawner as it is created; ci->data is the spawner's data (Blueprint at +0x18).

functions:
  - name: Entity_fireOutputEvent
    va: 0x14314e8e0
    signature: "u64(void* entity, void* bus, void* data, u32 eventHash)"
    note: >-
      Fires one of an entity's output events: a 17-byte thunk to 0x14314a9c0(bus, data, hash). The
      city alert manager's update fires its drone (0xcef736cc) and helicopter (0xc3c0bae9) with it,
      and the drone needs the manager's DroneAvailable input (+0xe8) in all three places
      (docs/research/city-alert.md). The trainer's No KSEC drops the drone event in free roam.
      Read in Ghidra 2026-11-05.
  - name: DataRegistry_register
    va: 0x143119500
    signature: "void(void* partition, u16 bundleId)"
    confidence: confirmed
    sources: [ghidra, game]
    note: >-
      Puts every object of a partition (its objects array at +0x18) in the data registry under a bundle id
      (3..2003; 2005..3004 are skipped): an rb-tree keyed by each object's address (head 0x1421054e0, root
      +0x10; node +0x20 address, +0x28 slot, +0x2a index) and a (slot, class id, index) -> object vector. The
      network sends a ghost's data as (slot, class id, index) found here by exact address (0x143138aa0);
      data not in it writes nothing and the stream goes out of step. One registry for both realms. Bundles
      fill it through a message (0x143138e00). GridNode registers its custom dashes' data with it
      (dashes.cpp, game-tested 2026-11-13).
  - name: DataRegistry_addListener
    va: 0x143134420
    signature: "void(void* registry, const void* listener)"
    confidence: inferred
    sources: [ghidra]
    note: >-
      Adds a load / unload listener: listener = 16 bytes {void* ctx, fn}, copied into an rb-tree at registry
      + 0x88 (anchor + 0x90; keyed by the 16 bytes, so the same pair twice is one entry). No lock taken: the
      game adds its one (SubLevelManager's, 0x143302290) at startup. DataRegistry_register and _unregister
      call every fn(ctx, &objects {begin, end, capacity}, u16 registry slot, bool loaded) under
      DataRegistry_Lock, after the objects went in (loaded 1), or after they left the address tree and
      before the table drops them (loaded 0; the objects are still allocated). Read in Ghidra 2026-11-13.
  - name: DataRegistry_removeListener
    va: 0x143138c60
    signature: "bool(void* registry, const void* listener)"
    confidence: inferred
    sources: [ghidra]
    note: "rcx += 0x88, then the tree's erase by the same 16 bytes (0x14311f440): 1 when it was there. Read in Ghidra 2026-11-13."
  - name: DataRegistry_unregister
    va: 0x14311b8e0
    signature: "void(u16 bundleId)"
    confidence: confirmed
    sources: [ghidra, game]
    note: >-
      Takes a bundle id's objects out of the data registry and frees its slot. An id left in at game exit
      crashed the registry's destructor (FUN_143117990, 2026-11-13).
  - name: SpatialPrefabReference_create
    va: 0x143360db0
    signature: "u64*(void* creator, u64* result, EntityCreationInfo* ci)"
    confidence: confirmed
    sources: [ghidra, game]
    note: >-
      The server creator of a SpatialPrefabReferenceObjectData (ci +0xd0): StreamRealm (+0x68) 2 makes a
      ServerBlueprintEntity under the creation info's bus (it instantiates the Blueprint at its stream-in
      event 0xd27bc17e; stream-out 0x21f3f677); 1, or no Blueprint, makes nothing; else
      fb_Blueprint_instantiateImpl.
  - name: Entity_requestDestroy
    va: 0x143167700
    signature: "void(void* entity, void* ownerRef)"
    note: >-
      Asks the entity's owner to destroy it: returns if entity +0x18 bit 10 is set (already going),
      else jumps to [ownerRef]'s vtable +0x10 with the entity (the owner queues it). How the game
      removes characters: a spawner's Unspawn (0x143383f48) and the AI coordinator's despawn
      (0x143933580), both with ownerRef = [character +0x28]. Research_Spawn_System_2026-10-23;
      checked in Ghidra 2026-11-03.
    confidence: confirmed
    sources: [research, ghidra]
