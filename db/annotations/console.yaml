# The engine's console and settings: commands, bound settings fields, the settings manager.
defaults: { confidence: inferred, sources: [gridnode] }

globals:
  - name: SettingsManager
    va: 0x142374a88
    type: "SettingsManager*"
    confidence: confirmed
    note: Read by every settings getter (e.g. 0x142a2ceb0 for GameTimeSettings).
  # From the user's Ghidra project (GridNodeSync, 2026-10-20); hypotheses until checked.
  - name: g_consoleEnabledForPlatform
    va: 0x1420f2b30
    type: "u8"
    note: "Only Console_executeCommand writes it (1, 0, or a value, at 0x142a8a91b / 0x142a8ab15 / 0x142a8ac56 / 0x142a8ac66) and reads it (0x142a8acef) before running a command typed in the game's own console; the user's report: 'enable Win32' sets it. 1 in our dump of a running game (checked 2026-11-05)."
    confidence: inferred
    sources: [ghidra]
  - name: Screenshot_commands
    va: 0x142110090
    type: "StaticCommand[3]"
    note: "The game's own static commands: Screenshot.Render (0x143555be0), Screenshot.Format (0x143555c30), Screenshot.LayerMode (0x143555d60), 0x28 bytes apart (checked 2026-11-05)."
    confidence: inferred
    sources: [ghidra]
  - name: GameTimeSettings_cached
    va: 0x142142a68
    type: "void*"
    note: "Cached GameTimeSettings object: null until a getter first fills it from SettingsManager_getByType(SettingsManager, GameTimeSettings_TypeInfo) (0x142a2ceb0, 0x14319c0e0). Check it for null, or call getByType. TimeScale +0x48, MaxVariableFps +0x34, ForceDeltaTime +0x3c, EnableSinglePlayerFixedTick +0x5a (reflected)."
