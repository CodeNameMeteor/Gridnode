# Characters (Faith, ghosts, AI).
defaults: { confidence: confirmed, sources: [mecmp] }

classes:
  - name: ServerControllableEntity
    realm: server
    confidence: inferred
    note: Observed on Pam server characters; the offset falls in ServerControllableEntity's range.
    members:
      - { offset: 0x138, name: spawner, type: "ServerCharacterSpawnEntity*", note: "The spawner that made this character." }

  - name: ServerCharacterEntity
    realm: server
    members:
      - { offset: 0x250, name: player, type: "void*", note: "Owning player (null for AI and ghosts)." }

  - name: PamServerCharacterEntity
    realm: server
    vtable: 0x141c3fcb0
    virtuals:
      - { offset: 0x108, name: getComponent, va: 0x1431c6eb0, signature: "void*(const TypeInfo* type)" }
      - name: applyCustomization
        offset: 0x340
        va: 0x14336cf00
        signature: "void(CustomizeRequest* request)"
        note: Applies a CustomizeCharacterData (look) to the character. See CustomizeRequest.

  - name: PamClientCharacterEntity
    realm: client
    vtable: 0x141c3c760
    members:
      - { offset: 0x28, name: physicsHolder, type: "void*", confidence: inferred, sources: [gridnode], note: "+0x1f0 -> +0x10 -> +0x438 = horizontal speed (f32), MEC_Trainer's PlayerVelocity (probe path search)." }
      - { offset: 0xb0, name: movementOwner, type: "void*", sources: [gridnode], note: "+0x48 -> +0 = PamMovement (faith.yaml)." }
      - { offset: 0x198, name: health, type: "PamClientHumanHealthComponent*", sources: [gridnode] }
      - { offset: 0x218, name: blueprint, type: "PamCharacterBlueprint*", sources: [gridnode] }
      - { offset: 0x238, name: player, type: "void*", sources: [gridnode], note: "Her ClientPlayer (not reflected); ClientPlayer +0x14a0 points back to the character." }
      - { offset: 0x250, name: camera, type: "PamClientCharacterCameraComponent*", sources: [gridnode], note: "+0x70 = camera forward (Vec3)." }
      - offset: 0x334
        name: ghostShader
        type: bool
        note: Copy of data->PamUseRunnersGhostShader taken at creation. Write this per character, not the shared data.
    virtuals:
      - { offset: 0x108, name: getComponent, va: 0x1431c6eb0, signature: "void*(const TypeInfo* type)" }
      - { offset: 0x3d8, name: setVisible, va: 0x143229480, signature: "void(bool visible)" }
    properties:
      - { name: Visible, hash: 0x35bc69ab, type: bool, note: "Handled by vf2 (0x143919960), which calls setVisible." }

  - name: PamClientMoveTrackerComponent
    realm: client
    confidence: inferred
    sources: [ghidra]
    vtable: 0x141c3d368
    note: "Faith's move tracker (0x200 bytes): each tick it reads the six ANT values its data's AntBindings name (PamMoveTrackerAntBinding: CurrentMove, DamageType, MovePosition, MoveNormal, MovingSpeedXZ, IsInJumpState) into +0x90.. (reader 0x144795f00, bound in vf37 0x143917410), then its update (0x1439189e0) publishes them at +0x60.. and counts each move it enters (+0x170, moves 1..31). Read 2026-11-05 from the user's ANT handbook and Ghidra."
    members:
      - { offset: 0x60, name: currentMove, type: i32, note: "Published: the move she is in (from +0x150)." }
      - { offset: 0x64, name: movingSpeedXZ, type: f32, note: "Published: MovingSpeedXZ (+0xc0)." }
      - { offset: 0x68, name: movedThisTick, type: f32, note: "Distance her transform moved since the last update (metres)." }
      - { offset: 0x6c, name: inJumpState, type: bool, note: "Published: IsInJumpState (+0xc4)." }
      - { offset: 0x78, name: animatable, type: "void*", note: "Her ClientAntAnimatableEntity (found in vf37); null: nothing is read." }
      - { offset: 0x90, name: antCurrentMove, type: i32, note: "As read from ANT this tick." }
      - { offset: 0x94, name: antDamageType, type: i32 }
      - { offset: 0xa0, name: antMovePosition, type: "f32[4]" }
      - { offset: 0xb0, name: antMoveNormal, type: "f32[4]" }
      - { offset: 0xc0, name: antMovingSpeedXZ, type: f32 }
      - { offset: 0xc4, name: antIsInJumpState, type: bool }
      - { offset: 0x150, name: move, type: i32, note: "The move in effect: ANT's CurrentMove when the move is valid, else -1." }
      - { offset: 0x154, name: damageType, type: i32, note: "-1 when not valid." }

  - name: PamServerMoveTrackerComponent
    realm: server
    confidence: inferred
    sources: [gridnode]
    note: "Tracks a character's movement (seen on Faith with the Field diff window, 2026-11-04): non-zero while she moves, back to 0 when she stops."
    members:
      - { offset: 0x6c, name: movedAmount, type: f32, note: "0 standing; 7.78 and 3.63 while moving (a speed or a distance since the last stop: not checked in Ghidra)." }
      - { offset: 0x70, name: movedAmount2, type: f32, note: "Changes with +0x6c (0.198 with 7.78, 0.089 with 3.63); not checked in Ghidra." }


structs:
  - name: CustomizeRequest
    size: 0x20
    note: Argument of PamServerCharacterEntity::applyCustomization (checked in Ghidra by MECMP).
    members:
      - { offset: 0x00, name: character, type: "void*" }
      - { offset: 0x08, name: player, type: "void*", note: "null: apply the data as is (0x14336c860); non-null: the player's own unlock path (0x143349f60)." }
      - { offset: 0x10, name: customization, type: "CustomizeCharacterData*" }
      - { offset: 0x18, name: skip, type: u8, note: "Non-zero: do nothing." }

hooks:
  - name: ClientHumanHealth_applyAntDamageSlot
    kind: vtable-slot
    vtable: 0x141c3d198
    offset: 0x148
    original: 0x1439196b0
    signature: "void(void* clientHealthComponent, const void* antDamage)"
    note: "PamClientHumanHealthComponent's slot 41 (ClientHealth_applyAntDamage): how the player's animation-graph damage reaches it (the AI component's own slot calls the function directly). The fall damage hold swaps this slot. Read in Ghidra 2026-11-14."
    confidence: inferred
    sources: [ghidra]
  - name: PamClientCharacterEntity_factory
    kind: creator-slot
    slot: 0x141c3cd80
    original: 0x143910d20
    signature: "void*(void* creator, EntityCreationInfo* ci, void* a3, void* a4)"

functions:
  - name: PamServerTeleportEntity_onEvent
    va: 0x1433845f0
    signature: "void(void* entity, const EntityEvent* event)"
    note: >-
      PamServerTeleportEntity vtable +0x20. On "Teleport" (event id 0x94ba5a24) teleports the player
      (ServerTeleportEntity_teleportPlayer) or, without one, the character linked to it
      (ServerTeleportEntity_teleportCharacter), to TeleportEntityData.NewPositionTransform (+0x20).
      Fast travel reaches it from ServerEventSync_onReachedClient (seen in a recording, 2026-10-20).
    confidence: inferred
    sources: [ghidra, recording]
  - name: ClientHealth_applyAntDamage
    va: 0x1439196b0
    signature: "void(void* clientHealthComponent, const void* antDamage)"
    note: >-
      Damage from a character's animation graph (an ANT DamageProcessorAsset, update 0x142f26cc0, through
      DamageFeature's handler) into a PamClientDamageInfo (built by 0x14390c370) sent on with 0x1434d94e0 (client
      to server, then the server health component). The record: +0x00 f32 amount, +0x04 i32 heart amount, +0x08
      byte allow last chance, +0x0c the attacker's id, +0x10 vec4 direction, +0x20 byte, +0x28 the damage type value
      (an enum asset whose +0x1c is the value: 1 gives PamDamageType_Fall 0x68, 0 PamDamageType_Unkown 100, others
      Melee 0x66), +0x30, +0x38 and +0x40 more enum values (+0x1c each). PamClientHumanHealthComponent's vtable
      (0x141c3d198) slot 41 (+0x148) and PamClientHealthComponent's (0x141c3c5d0) hold it; PamClientAIHealthComponent's calls it. No fall height is compared in
      C++: the graph decides when and how much. Gemini block J, checked in Ghidra 2026-11-14. GridNode's fall damage
      hold swaps the human component's slot (ClientHealth_applyAntDamageSlot).
    confidence: inferred
    sources: [research, ghidra]
  - name: LocalClientCharacter
    va: 0x1439655f0
    signature: "PamClientCharacterEntity*()"
    note: The local player's client character (null when there is none). Game thread.
  - name: ServerCharacterEntity_teleport
    va: 0x143378830
    signature: "void(ServerCharacterEntity* character, const LinearTransform* transform)"
    note: The game's own teleport (as ServerTeleportEntity_teleportPlayer 0x143391430 uses it). The transform must be 16-byte aligned. Server game thread.
