# Characters (Faith, ghosts, AI).
defaults: { confidence: confirmed, sources: [mecmp] }

classes:
  - name: ServerControllableEntity
    realm: server
    confidence: inferred
    note: Observed on Pam server characters; the offset falls in ServerControllableEntity's range.
    members:
      - { offset: 0x138, name: spawner, type: "ServerCharacterSpawnEntity*", note: "The spawner that made this character." }

  - name: ServerCharacterEntity
    realm: server
    members:
      - { offset: 0x250, name: player, type: "void*", note: "Owning player (null for AI and ghosts)." }

  - name: PamServerCharacterEntity
    realm: server
    vtable: 0x141c3fcb0
    virtuals:
      - { offset: 0x108, name: getComponent, va: 0x1431c6eb0, signature: "void*(const TypeInfo* type)" }
      - name: applyCustomization
        offset: 0x340
        va: 0x14336cf00
        signature: "void(CustomizeRequest* request)"
        note: Applies a CustomizeCharacterData (look) to the character. See CustomizeRequest.

  - name: PamClientCharacterEntity
    realm: client
    vtable: 0x141c3c760
    members:
      - { offset: 0x28, name: physicsHolder, type: "void*", confidence: inferred, sources: [gridnode], note: "+0x1f0 -> +0x10 -> +0x438 = horizontal speed (f32), MEC_Trainer's PlayerVelocity (probe path search)." }
      - { offset: 0xb0, name: movementOwner, type: "void*", sources: [gridnode], note: "+0x48 -> +0 = PamMovement (faith.yaml)." }
      - { offset: 0x198, name: health, type: "PamClientHumanHealthComponent*", sources: [gridnode] }
      - { offset: 0x218, name: blueprint, type: "PamCharacterBlueprint*", sources: [gridnode] }
      - { offset: 0x238, name: player, type: "void*", sources: [gridnode], note: "Her ClientPlayer (not reflected); ClientPlayer +0x14a0 points back to the character." }
      - { offset: 0x250, name: camera, type: "PamClientCharacterCameraComponent*", sources: [gridnode], note: "+0x70 = camera forward (Vec3)." }
      - offset: 0x334
        name: ghostShader
        type: bool
        note: Copy of data->PamUseRunnersGhostShader taken at creation. Write this per character, not the shared data.
    virtuals:
      - { offset: 0x108, name: getComponent, va: 0x1431c6eb0, signature: "void*(const TypeInfo* type)" }
      - { offset: 0x3d8, name: setVisible, va: 0x143229480, signature: "void(bool visible)" }
    properties:
      - { name: Visible, hash: 0x35bc69ab, type: bool, note: "Handled by vf2 (0x143919960), which calls setVisible." }

structs:
  - name: CustomizeRequest
    size: 0x20
    note: Argument of PamServerCharacterEntity::applyCustomization (checked in Ghidra by MECMP).
    members:
      - { offset: 0x00, name: character, type: "void*" }
      - { offset: 0x08, name: player, type: "void*", note: "null: apply the data as is (0x14336c860); non-null: the player's own unlock path (0x143349f60)." }
      - { offset: 0x10, name: customization, type: "CustomizeCharacterData*" }
      - { offset: 0x18, name: skip, type: u8, note: "Non-zero: do nothing." }

hooks:
  - name: PamClientCharacterEntity_factory
    kind: creator-slot
    slot: 0x141c3cd80
    original: 0x143910d20
    signature: "void*(void* creator, EntityCreationInfo* ci, void* a3, void* a4)"

functions:
  - name: PamServerTeleportEntity_onEvent
    va: 0x1433845f0
    signature: "void(void* entity, const EntityEvent* event)"
    note: >-
      PamServerTeleportEntity vtable +0x20. On "Teleport" (event id 0x94ba5a24) teleports the player
      (ServerTeleportEntity_teleportPlayer) or, without one, the character linked to it
      (ServerTeleportEntity_teleportCharacter), to TeleportEntityData.NewPositionTransform (+0x20).
      Fast travel reaches it from ServerEventSync_onReachedClient (seen in a recording, 2026-10-20).
    confidence: inferred
    sources: [ghidra, recording]
  - name: LocalClientCharacter
    va: 0x1439655f0
    signature: "PamClientCharacterEntity*()"
    note: The local player's client character (null when there is none). Game thread.
  - name: ServerCharacterEntity_teleport
    va: 0x143378830
    signature: "void(ServerCharacterEntity* character, const LinearTransform* transform)"
    note: The game's own teleport (as ServerTeleportEntity_teleportPlayer 0x143391430 uses it). The transform must be 16-byte aligned. Server game thread.
  # From the user's Ghidra project (GridNodeSync, 2026-10-20); hypotheses until checked.
  - name: ServerCharacterHealthComponent_registerForUpdate
    va: 0x14336c390
    signature: "void(i64, u32)"
    note: "Named in Ghidra as ServerCharacterHealthComponent_registerForUpdate; checked in the decompiler (2026-10-30): its strings ('ServerCharacterHealthComponent')."
    confidence: inferred
    sources: [ghidra]
  - name: ServerCharacterEntity_applyCustomizeData
    va: 0x14336c860
    signature: "void(i64, void*)"
    note: "Named in Ghidra as ServerCharacterEntity_applyCustomizeData; signature from the decompiler (2026-10-30), the name is not checked yet."
    confidence: hypothesis
    sources: [ghidra]
  - name: ServerTeleportEntity_clampTargetAboveGround
    va: 0x143381370
    signature: "void(void* self, void*)"
    note: "Named in Ghidra as ServerTeleportEntity_clampTargetAboveGround; checked in the decompiler (2026-10-30): its strings ('ServerTeleportEntity_checkSpawningBelowGround')."
    confidence: inferred
    sources: [ghidra]
  - name: ServerTeleportEntity_getTargetTransform
    va: 0x143387070
    signature: "u64(void* self, void*)"
    note: "Named in Ghidra as ServerTeleportEntity_getTargetTransform; checked in the decompiler (2026-10-30): resolves the target entity's transform (Entity_resolveTransform)."
    confidence: inferred
    sources: [ghidra]
  - name: ServerTeleportEntity_teleportCharacter
    va: 0x143391600
    signature: "void(void* self, ServerCharacterEntity*)"
    note: "Named in Ghidra as ServerTeleportEntity_teleportCharacter; checked in the decompiler (2026-10-30): gets the target, clamps it above ground, clears physics there, then ServerCharacterEntity_teleport."
    confidence: inferred
    sources: [ghidra]
  - name: PamServerHealthComponent_ctor
    va: 0x14391e410
    signature: "void*(void* self, void*, u64)"
    note: "Named in Ghidra as PamServerHealthComponent_ctor; checked in the decompiler (2026-10-30): sets the PamServerHealthComponent vtable."
    confidence: inferred
    sources: [ghidra]
  - name: PamServerHumanHealthComponent_ctor
    va: 0x14391e530
    signature: "void*(void* self, void*, u64)"
    note: "Named in Ghidra as PamServerHumanHealthComponent_ctor; checked in the decompiler (2026-10-30): sets the PamServerHumanHealthComponent vtable."
    confidence: inferred
    sources: [ghidra]
  - name: HealthComponent_connectIsImmortal
    va: 0x14474f280
    signature: "void*(i64, void*, u64)"
    note: "Named in Ghidra as HealthComponent_connectIsImmortal; checked in the decompiler (2026-10-30): binds the property IsImmortal (hash 0xa1b7b692, checked) as a bool at +0x88."
    confidence: inferred
    sources: [ghidra]

constants:
  - { name: ClientCharacter_ViewModeInterface, value: 0x1d8, note: "Embedded interface whose getViewMode (slot 0x141c3cc68 -> 0x14390ed90, int(iface)) picks the body mesh: 1 = third-person body with head (MECMP)." }
  - { name: ViewModeSlot, value: 0x141c3cc68 }
  - { name: ClientCharacter_GetViewMode, value: 0x14390ed90 }
  - { name: PlayerBlueprint, value: "Characters/FaithCharacter" }
  - { name: GhostBlueprint, value: "Characters/Projection/ProjectionCharacter" }
