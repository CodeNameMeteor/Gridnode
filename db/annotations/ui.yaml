# UI systems, friend markers, challenge entities.
defaults: { confidence: confirmed, sources: [mecmp] }

classes:
  - name: PamUISystem
    realm: client
    vtable: 0x141cb63b0
    members:
      - { offset: 0x8c8, name: pauseController, type: "UIPauseController*", note: "A POINTER to the controller (PamUISystem_update loads it: *(UIPauseController**)(ui+0x8c8)), not inline: Ghidra's struct had it inline and the trainer read garbage until 2026-11-06. Pause requests are the ints at +0x08 / +0x0c of the controller." }

  - name: PamClientPresenceInfoManagerEntity
    realm: client
    vtable: 0x141c74be8
    note: "Friend markers and player presence on the 2D world map and HUD friend radar. Holds a fixed slot array."
    members:
      - { confidence: hypothesis, offset: 0x20, name: levelContext, type: "void*", note: "Level context pointer, passed to EntityBus_getLevel." }
      - { confidence: hypothesis, offset: 0x28, name: managerData, type: "void*", note: "Manager entity data asset (+0x18 holds PF_PresenceInfo Blueprint*)." }
      - { confidence: hypothesis, offset: 0x39, name: isPaused, type: u8, note: "Pause or disable flag." }
      - { confidence: hypothesis, offset: 0x3c, name: updateInterval, type: f32, note: "Online presence query interval (default 10.0s)." }
      - { confidence: hypothesis, offset: 0x40, name: updateTimer, type: f32, note: "Timer counting down to next online position publication." }
      - { confidence: hypothesis, offset: 0x44, name: permissionsTimer, type: f32, note: "Timer counting down to next privacy/permissions query." }
      - { confidence: hypothesis, offset: 0x48, name: settings, type: "void*", note: "PamSocialPlaySettings* (+0x20 specifies max slot capacity)." }
      - { confidence: hypothesis, offset: 0x50, name: slotsBegin, type: "PresenceSlot*", note: "Vector begin pointer to slot array (0x50 bytes per slot)." }
      - { confidence: hypothesis, offset: 0x58, name: slotsEnd, type: "PresenceSlot*", note: "Vector end pointer to slot array." }

  - name: PamClientPresenceInfoEntity
    confidence: hypothesis
    realm: client
    vtable: 0x141c74ac0
    note: "Spawned per active slot from PF_PresenceInfo prefab. Drives map marker, transform, and visibility."
    members:
      - { confidence: hypothesis, offset: 0x30, name: nameProperty, type: "void*", note: "Property connector for player display name (TI_LocalizedString, 0xbf943de7)." }
      - { confidence: hypothesis, offset: 0x38, name: transformProperty, type: "void*", note: "Property connector for 4x4 matrix world position (TI_LinearTransform, 0x7f30d4fe)." }
      - { confidence: hypothesis, offset: 0x40, name: onlineIdProperty, type: "void*", note: "Property connector for online account ID (TI_PamOnlineIdData, 0xbb211b07)." }
      - { confidence: hypothesis, offset: 0x48, name: validProperty, type: "void*", note: "Property connector for valid boolean state (TI_Boolean, 0x0d6ef4f3)." }
      - { confidence: hypothesis, offset: 0x50, name: shownProperty, type: "void*", note: "Property connector for shown/visible boolean state (TI_Boolean, 0xcacba3e1)." }

  - name: PamClientUIPauseEntity
    confidence: hypothesis
    realm: client
    vtable: 0x141cbd4a8
    members:
      - { confidence: hypothesis, offset: 0x28, name: data, type: "PamUIPauseEntityData*" }
      - { confidence: hypothesis, offset: 0x30, name: active, type: u8 }

  - name: PamServerNamedChallengeEntity
    confidence: hypothesis
    realm: server
    vtable: 0x141c7ec70
    note: "Server entity managing named challenges (dashes, deliveries, GridNodes). Holds challenge data at +0x80."
    members:
      - { confidence: hypothesis, offset: 0x80, name: challengeData, type: "PamNamedChallengeDataLayout*" }

  - name: PamServerChallengeMarkerEntity
    confidence: hypothesis
    realm: server
    vtable: 0x141c7e3e8
    note: "Server entity managing player-authored time trials (UGC) and ReachThis markers."
    members:
      - { confidence: hypothesis, offset: 0x28, name: data, type: "PamChallengeMarkerEntityDataLayout*" }
      - { confidence: hypothesis, offset: 0x80, name: contentId, type: "u8[24]" }
      - { confidence: hypothesis, offset: 0xb8, name: name, type: "const i8*" }

  - name: PamUIPauseEntityData
    confidence: hypothesis
    realm: client
    size: 0x20

structs:
  - name: PresenceInfoManagerPool
    confidence: hypothesis
    size: 0x38
    opaque: true
    note: "Container managing all active PamClientPresenceInfoManagerEntity instances in the client world (vtable 0x141c74bb8). Not a reflected class, so a struct; at least 0x38 bytes."
    members:
      - { confidence: hypothesis, offset: 0x28, name: entriesBegin, type: "PresencePoolEntry*", note: "Vector begin pointer to pool entries (0x10 bytes per entry)." }
      - { confidence: hypothesis, offset: 0x30, name: entriesEnd, type: "PresencePoolEntry*", note: "Vector end pointer to pool entries." }

  - name: OnlineId
    confidence: hypothesis
    size: 0x28
    members:
      - { confidence: hypothesis, offset: 0x00, name: id, type: u64, note: "EA Nucleus / Origin persona account ID." }
      - { confidence: hypothesis, offset: 0x08, name: name, type: "i8[32]", note: "Null-terminated player display name." }

  - name: PresenceSlot
    confidence: hypothesis
    size: 0x50
    members:
      - { confidence: hypothesis, offset: 0x00, name: shown, type: u8, note: "1 = marker visible on map and radar, 0 = hidden. Set from privacy check or mod override." }
      - { confidence: hypothesis, offset: 0x04, name: priority, type: i32, note: "Slot priority. Friends use 0; mods use 1000 to prevent eviction." }
      - { confidence: hypothesis, offset: 0x08, name: onlineId, type: "OnlineId", note: "Online account identifier." }
      - { confidence: hypothesis, offset: 0x30, name: worldPos, type: "Vec4", note: "Marker 3D position (x, y, z, w). Must be 16-byte aligned for MOVAPS." }
      - { confidence: hypothesis, offset: 0x40, name: blueprintInstance, type: "void*", note: "Spawned instance of PF_PresenceInfo blueprint." }
      - { confidence: hypothesis, offset: 0x48, name: presenceInfoEntityHandle, type: "void*", note: "Handle / ref-counted pointer to PamClientPresenceInfoEntity." }

  - name: PresencePoolEntry
    confidence: hypothesis
    size: 0x10
    members:
      - { confidence: hypothesis, offset: 0x00, name: manager, type: "PamClientPresenceInfoManagerEntity*", note: "Active presence manager entity for level." }
      - { confidence: hypothesis, offset: 0x08, name: interval, type: u16, note: "Update interval in ticks." }
      - { confidence: hypothesis, offset: 0x0a, name: timer, type: u16, note: "Remaining ticks until next update." }
      - { confidence: hypothesis, offset: 0x0c, name: accumulatedTime, type: f32, note: "Accumulated delta time in seconds." }

  - name: PamNamedChallengeDataLayout
    confidence: hypothesis
    size: 0xa0
    members:
      - { confidence: hypothesis, offset: 0x10, name: sid, type: "const i8*", note: "Localization ID string key, e.g. 'ID_NC_THEVIEW02'." }
      - { confidence: hypothesis, offset: 0x58, name: mainStatCode, type: "const i8*", note: "Stat code key, e.g. 'ch_rrt_tv2_time' (dashes start with 'ch_rrt_')." }
      - { confidence: hypothesis, offset: 0x98, name: contentId, type: u32, note: "Unique challenge ID." }

  - name: PamChallengeMarkerEntityDataLayout
    confidence: hypothesis
    size: 0x70
    members:
      - { confidence: hypothesis, offset: 0x68, name: checkpointOrder, type: i32, note: "0 for ReachThis / Beat L.E. (unannounced); != 0 for sequential or open timed runs." }
      - { confidence: hypothesis, offset: 0x6c, name: time, type: f32, note: "Target or author time in seconds." }
  - name: UIPauseController
    size: 0x10
    opaque: true
    members:
      - { offset: 0x08, name: pauseRequestsA, type: i32 }
      - { offset: 0x0c, name: pauseRequestsB, type: i32 }

globals:
  - name: PamClientSharedContentManager
    va: 0x14257e178
    type: "void*"
    confidence: inferred
    sources: [ghidra]
    note: "The PamClientSharedContentManagerEntity: set at the end of its constructor (0x143a39690), zeroed first in its destructor (0x143a3b750); 39 references, no other writes (dash-map-register c1, checked 2026-11-13). Its vf15 (0x143a48360) registers the level's challenges and their map markers; client thread."
  - name: PamUISystemInstance
    va: 0x1424157f0
    type: "void*"
    confidence: inferred
    sources: [ghidra]
    note: "The PamUISystem (0x9e0 bytes), read by the getter at 0x143269ae0 (mov rax, [rip+..]; ret); zeroed by the UI system's destructor. Checked in Ghidra 2026-11-06."
  - name: TI_PamUIPauseEntityData
    va: 0x142887770
    type: "void*"
    confidence: hypothesis
    sources: [ghidra]
    note: "TypeInfo for PamUIPauseEntityData."

hooks:
  - name: PamUISystem_update
    kind: vtable-slot
    vtable: 0x141cb63b0
    offset: 0x140
    original: 0x143b16c50
    signature: "void(void* uiSystem, void* updateInfo)"
    note: Per-frame UI update (vf40). Its only call to UIPauseController_applyToClient passes the controller at +0x8c8.
  - name: PresenceInfoManagerPool_update
    kind: vtable-slot
    slot: 0x141c74bc8
    original: 0x143a4bb30
    signature: "void(void* pool, void* updateInfo)"
    note: "Per-frame update of friend marker manager pool (vf1). Dispatches to active level PamClientPresenceInfoManagerEntity instances. Hook point for injecting custom player markers."
  - name: PamClientPresenceInfoManagerEntity_create
    kind: creator-slot
    slot: 0x141c74cb8
    original: 0x143a41850
    signature: "void*(void* creator, EntityCreationInfo* ci, void* a3, void* a4)"
  - name: PamServerNamedChallengeEntity_create
    kind: creator-slot
    slot: 0x141c7ee00
    original: 0x143a834b0
    signature: "void*(void* creator, EntityCreationInfo* ci, void* a3, void* a4)"
    note: Dashes and other named challenges.
  - name: PamServerChallengeMarkerEntity_create
    kind: creator-slot
    slot: 0x141c7e9f0
    original: 0x143a83460
    signature: "void*(void* creator, EntityCreationInfo* ci, void* a3, void* a4)"
    note: Player-made time trials.
  - name: PamServerCustomizeProjectionCharacterEntity_create
    kind: creator-slot
    slot: 0x141c7eb40
    original: 0x143a83490
    signature: "void*(void* creator, EntityCreationInfo* ci, void* a3, void* a4)"
    note: Time-trial marker look picker; the thunk calls the factory 0x143a7b5a0.

functions:
  - name: PamClientSharedContentManager_findMarker
    va: 0x143a43570
    signature: "void*(void* manager, void* challengeData)"
    confidence: inferred
    sources: [ghidra]
    note: "Finds the runtime marker of a challenge by ContentId (challengeData +0x98): hash map at manager +0x1d8 (bucket count +0x1e0), marker pointer vector at +0x180. Returns 0 if none. manager is the global at 0x14257e178. Called from the PamClientNamedChallengeEntity constructor (0x143a38080)."
  - name: PamClientSharedContentManager_addChallengeMarker
    va: 0x143a4f720
    signature: "void(void* manager, void* a2, void* challengeData)"
    confidence: inferred
    sources: [ghidra]
    note: "Adds a PamNamedChallengeMapMarker (0x230 bytes, constructor 0x143a7ca20) for a challenge if its type data (challengeData +0x28) has a non-null +0x68: inserts ContentId (+0x98) into the map at manager +0x1d0 (a ContentId already there: nothing, silently), appends to the vector at +0x180, then calls slot +0x38 of the new marker (PamNamedChallengeMapMarker_refresh). a2 is the level's layout entry (PamSocialPlayLevelDescriptionComponent array, 0xc0 each: a LinearTransform at +0x00, the challenge's GUID at +0x40): the constructor copies its transform (marker +0x1d0 position, +0x1e0 transform) and keeps no pointer to it. The marker keeps challengeData (+0x1b8). No removal function is known (dash-map-register c9). Checked 2026-11-13."
  - name: PamClientNamedChallengeEntity_storeResult
    va: 0x143a4f0b0
    signature: "void(void* entity, i32 playerIdx, i64 best, i8 hasBest)"
    confidence: inferred
    sources: [ghidra]
    note: "Client: a player's best for the challenge (entity +0x58 = PamNamedChallengeData) from the network (ghost read 0x143a444b0 and 0x143a48eb0; the server reads DashState_getBest by the stat key). Player 0: +0xf0 hasBest, +0x108 / +0x100 stars (NamedChallenge_starsForValue 0x143a82b40), and the map marker (findMarker) told the best. Stores +0xa0[player] hasBest, +0xa8[player] best; +0xf8 the local player's best. Checked 2026-11-13 (dash-end-screen-best c2)."
  - name: PamNamedChallengeMapMarker_refresh
    va: 0x143a8acf0
    signature: "void(void* marker)"
    confidence: inferred
    sources: [ghidra]
    note: "vf7 (vtable 0x141c7dc98 +0x38), called by addChallengeMarker on the new marker: shown (+0x121) when +0x225 (allowed: 1 when challengeData +0x40 is 0) and the manager's type filter (0x143a43f60) agree and the type data's RequiresOnline (+0x9a) is off or the manager is online (+0x81); shows (0x143a5fae0) or hides (0x143a5a0a0) by +0x58, then refreshes the stars (0x143a8bd80). Checked 2026-11-13."
  - name: UIPauseController_applyToClient
    va: 0x143b16ae0
    signature: "void(UIPauseController* controller)"
    confidence: inferred
  - name: UIPauseController_request
    va: 0x143b16210
    signature: "void(UIPauseController* controller, i8 on, i8 full)"
    confidence: hypothesis
    sources: [ghidra]
    note: "Increments (on != 0) or decrements (on == 0) pauseRequestsA (+0x08). If full != 0, likewise increments or decrements pauseRequestsB (+0x0c). Called exclusively by PamClientUIPauseEntity."
  - name: UIPauseController_isPaused
    va: 0x143b12830
    signature: "bool(UIPauseController* controller)"
    confidence: hypothesis
    sources: [ghidra]
    note: "Returns true if pauseRequestsA > 0 and (timescale < 1e-6 or pauseRequestsB > 0). Read by UI update 0x143b173e0."
  - name: PlayerView_getTimescale
    va: 0x1432a8710
    signature: "f32(void* subview)"
    confidence: hypothesis
    sources: [ghidra]
    note: "Returns max(subview + 0x64, +0x8c, +0x3c): the effective simulation timescale factor (1.0 normal, 0.0 frozen). Evaluated by UIPauseController_applyToClient."
  - name: PlayerView_getSubview
    va: 0x1432a8d80
    signature: "void*(u32 playerIndex)"
    confidence: hypothesis
    sources: [ghidra]
    note: "Returns player subview timing context for playerIndex (0 for local player)."
  - name: PamClientUIPauseEntity_onEvent
    va: 0x143b3ac80
    signature: "void(void* entity, void* eventData)"
    confidence: hypothesis
    sources: [ghidra]
    note: "Event handler for PamClientUIPauseEntity (vf4). Event 0x0dd8ddf7 calls pause (0x143b40460); event 0xc44b5c3c calls unpause (0x143b41900). Both evaluate full = (data->postponeUntilFadedIn == 0)."
  - name: PamClientUIPauseEntity_create
    va: 0x143b35850
    signature: "void*(void* creator, EntityCreationInfo* ci, void* a3, void* a4)"
    confidence: hypothesis
    sources: [ghidra]
    note: "Creator for PamClientUIPauseEntity (0x38 bytes, vtable 0x141cbd4a8). Holds pointer to PamUIPauseEntityData at +0x28, active state at +0x30."
  - name: localize
    va: 0x1436a8d40
    signature: "bool(i8* out, u32 capacity, const i8* sid, void* args)"
    confidence: hypothesis
    sources: [mecmp, ghidra]
    note: "Resolves a localization ID (e.g. 'ID_NC_THEVIEW02') into a localized display string (e.g. 'The View'). Calls string singleton 0x1436a96d0."
  - name: PresenceInfoManager_assignSlot
    va: 0x143a405e0
    signature: "void*(void* manager, void* onlineId, const f32* position, i32 priority)"
    confidence: confirmed
    sources: [mecmp, ghidra]
    note: "Assigns or updates a presence slot (0x50 bytes) for an OnlineId with priority and 16-byte aligned Vec4 world position. Spawns PF_PresenceInfo blueprint on first use."

constants:
  - { name: Event_UIPause_On, value: 0x0dd8ddf7, confidence: hypothesis, sources: [ghidra], note: "Event triggering PamClientUIPauseEntity pause (0x143b40460)." }
  - { name: Event_UIPause_Off, value: 0xc44b5c3c, confidence: hypothesis, sources: [ghidra], note: "Event triggering PamClientUIPauseEntity unpause (0x143b41900)." }
  - { name: MessageCategory_PamplonaGamePaused, value: 0x0dc84585, confidence: hypothesis, sources: [ghidra] }
  - { name: MessageType_PamplonaGamePaused, value: 0xbbc34556, confidence: hypothesis, sources: [ghidra], note: "Broadcast when game pause changes. Payload bool isPaused at offset +0x48." }
  - { name: MessageCategory_ClientMetricsPause, value: 0xd65bfe6b, confidence: hypothesis, sources: [ghidra] }
  - { name: MessageType_ClientMetricsPause, value: 0x3e6ab63c, confidence: hypothesis, sources: [ghidra], note: "Broadcast to metrics when game pause changes. Payload bool isPaused at +0x30." }
