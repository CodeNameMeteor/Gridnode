# Physics: ray casts, and how a physics entity's collision follows its transform.
defaults: { confidence: confirmed, sources: [mecmp] }

structs:
  - name: RaycastQuery
    size: 0x30
    align: 16
    note: What the caster reads (MOVAPS, 16-byte aligned). A radius above ~0 makes it a sphere sweep.
    members:
      - { offset: 0x00, name: from, type: "f32[4]" }
      - { offset: 0x10, name: to, type: "f32[4]" }
      - { offset: 0x20, name: radius, type: f32 }
      - { offset: 0x24, name: flags, type: "u8[3]", note: "Set by the entity's query builder (0x143a22330); not read by the caster." }
  - name: RaycastResult
    size: 0x40
    align: 16
    note: "A miss: position = to, fraction = 1, distance = |to - from|, hit = 0."
    members:
      - { offset: 0x00, name: position, type: "f32[4]" }
      - { offset: 0x10, name: normal, type: "f32[4]" }
      - { offset: 0x20, name: id, type: u32 }
      - { offset: 0x24, name: fraction, type: f32 }
      - { offset: 0x28, name: distance, type: f32 }
      - { offset: 0x2c, name: hit, type: u8 }
      - { offset: 0x30, name: tail, type: u16, note: "Always 0x0101." }
  - name: PhysicsRayInput
    size: 0xd0
    align: 16
    confidence: inferred
    sources: [research]
    note: >-
      What Physics_castRay reads, as RaycastQuery_execute builds it on its stack. The ignore list is an
      inline vector of body ids (begin = end = inline, capacity end = from).
    members:
      - { offset: 0x00, name: wants, type: u32, note: "Bits: 1 material, 2 part, 4 bone. The body id is filled in always." }
      - { offset: 0x08, name: filter, type: u32, note: "Collision filter; 9 for a plain ray." }
      - { offset: 0x10, name: ignoreBegin, type: "u32*" }
      - { offset: 0x18, name: ignoreEnd, type: "u32*" }
      - { offset: 0x20, name: ignoreCapacityEnd, type: "u32*" }
      - { offset: 0x30, name: ignoreInline, type: "u32[12]" }
      - { offset: 0x60, name: from, type: "f32[4]" }
      - { offset: 0x70, name: to, type: "f32[4]" }
      - { offset: 0x80, name: sweep, type: u8, note: "0 for a ray." }
  - name: PhysicsRayHit
    size: 0x50
    align: 16
    confidence: inferred
    sources: [research]
    note: "Initialised by the caller to body -1, material -1, part -1 (RaycastQuery_execute)."
    members:
      - { offset: 0x00, name: body, type: u32, note: "Packed from the Havok body's user data; the low 16 bits index the physics owner's object table (Physics_Owner, PhysicsOwner_Objects)." }
      - { offset: 0x08, name: material, type: u32 }
      - { offset: 0x0c, name: part, type: u32 }
      - { offset: 0x10, name: bone, type: u32 }
      - { offset: 0x18, name: fraction, type: f32 }
      - { offset: 0x20, name: normal, type: "f32[4]" }
      - { offset: 0x30, name: position, type: "f32[4]" }
      - { offset: 0x40, name: valid, type: u8 }

functions:
  - name: RaycastQuery_execute
    va: 0x143a24890
    signature: "void(const RaycastQuery* query, void* world, void* physics, RaycastResult* result)"
    note: >-
      The ray caster behind the game's ray cast entities (ServerRaycastEntity). world is unused.
      Physics: ServerGameWorld+0x50 -> +0xf0 -> +0x18 (getter 0x1434ee940). A plain ray goes on to
      0x1434e27f0 with collision filter 9.
  # From the user's Ghidra project (GridNodeSync, 2026-10-20); hypotheses until checked.
  - name: PhysicsQuery_raycastNamed
    va: 0x1432e6730
    note: "Named in Ghidra as PhysicsQuery_raycastNamed. Signature not known yet."
    confidence: hypothesis
    sources: [ghidra]
  - name: ServerTeleportEntity_clearPhysicsAtTarget
    va: 0x143381560
    note: "Named in Ghidra as ServerTeleportEntity_clearPhysicsAtTarget. Signature not known yet."
    confidence: hypothesis
    sources: [ghidra]
  - name: Physics_castRay
    va: 0x1434e27f0
    signature: "bool(void* physics, const PhysicsRayInput* input, PhysicsRayHit* hit)"
    note: >-
      The closest hit of a ray, with the body it hit (RaycastQuery_execute drops the body). Hits are
      collected by 0x14351a1a0 through a collector whose add (0x143512f10) resolves each hit with
      0x1435177b0 and skips bodies on the ignore list.
    confidence: inferred
    sources: [ghidra, research]
  - name: PhysicsHolder_getPhysics
    va: 0x1434ee940
    note: "Named in Ghidra as PhysicsHolder_getPhysics. Signature not known yet."
    confidence: hypothesis
    sources: [ghidra]
  - name: Physics_castRayCollectHits
    va: 0x14351a1a0
    note: "Named in Ghidra as Physics_castRayCollectHits. Signature not known yet."
    confidence: hypothesis
    sources: [ghidra]
  - name: ServerRaycastEntity_update
    va: 0x143a204b0
    note: "Named in Ghidra as ServerRaycastEntity_update. Signature not known yet."
    confidence: hypothesis
    sources: [ghidra]
  - name: RaycastEntity_buildQuery
    va: 0x143a22330
    note: "Named in Ghidra as RaycastEntity_buildQuery. Signature not known yet."
    confidence: hypothesis
    sources: [ghidra]

constants:
  - { name: World_PhysicsManager, value: 0x50 }
  - { name: PhysicsManager_Holder, value: 0xf0 }
  - { name: PhysicsHolder_Physics, value: 0x18 }
  - { name: Physics_HavokWorld, value: 0x10 }
  - { name: HavokWorld_FilterOwner, value: 0x150 }
  - { name: FilterOwner_Filter, value: 0x4d0 }
  - { name: Physics_Owner, value: 0x8, confidence: inferred, sources: [research], note: "The object Physics_castRay's hits are resolved against." }
  - { name: PhysicsOwner_Objects, value: 0x130, confidence: inferred, sources: [research], note: "Table of physics objects, indexed by the low 16 bits of a hit's body (0x1434ee750)." }
  - { name: Entity_Flags, value: 0x18, confidence: inferred, sources: [research], note: "u32 flags of an entity." }
  - { name: EntityFlag_NotifyTransform, value: 0x8, confidence: inferred, sources: [research], note: "SpatialEntity_setTransform calls vtable +0xe0 (transform changed) when set." }
  - { name: EntityFlag_TeleportPhysics, value: 0x8000000, confidence: inferred, sources: [research], note: "A physics entity's transform-changed (0x1431cbcd0) moves its physics object (vtable +0xf0) only when set: the runtime form of TeleportPhysicsOnTransformChanges." }
  - { name: PhysicsEntity_Physics, value: 0x60, confidence: inferred, sources: [research], note: "ServerPhysicsEntity / ClientPhysicsEntity: its physics component (ServerStaticModelPhysicsComponent for a static model). Its vtable +0xf0 (0x1434e2470) only refreshes the broadphase from the bodies' current transforms; it does not move them." }
  - { name: PhysicsComponent_BodyIds, value: 0x30, confidence: inferred, sources: [research], note: "u32* array of body ids (the same ids a ray hit reports)." }
  - { name: PhysicsComponent_Manager, value: 0x58, confidence: inferred, sources: [research], note: "PhysicsManager*." }
  - { name: PhysicsComponent_BodyCount, value: 0x60, confidence: inferred, sources: [research], note: "u16." }
  - { name: PhysicsManager_Owners, value: 0xf0, confidence: inferred, sources: [research], note: "Owner table indexed by bits 16..23 of a body id (0x1434ee790); an owner's PhysicsOwner_Objects is indexed by the low 16 bits." }
  - { name: RigidBody_vf_getTransform, value: 0x170, confidence: inferred, sources: [research], note: "LinearTransform*(RigidBody*, LinearTransform* out): from the Havok body (0x1434f13f0)." }
  - { name: RigidBody_vf_setTransform, value: 0x178, confidence: inferred, sources: [research], note: "void(RigidBody*, const LinearTransform*, bool teleport): hknpWorld setBodyTransform (0x1434f21e0)." }
  # Static model groups: one GroupRigidBody (Havok hknpStaticCompoundShape) for all copies of all
  # members; research 2026-10-20 (0x1434eda80, 0x1434f2020, 0x14318fbc0, 0x143193690).
  - { name: GroupRigidBody_BodyIndex, value: 0x50, confidence: inferred, sources: [research], note: "i32 Havok body index (hknpWorld bodies, 0x90 each)." }
  - { name: GroupRigidBody_Shape, value: 0x58, confidence: inferred, sources: [research], note: "hknpStaticCompoundShape* of the group." }
  - { name: GroupRigidBody_PartToInstance, value: 0x110, confidence: inferred, sources: [research], note: "Array of 4-byte entries; the low i16 of entry [part] is the compound instance index (0x1434eda80)." }
  - { name: CompoundShape_Instances, value: 0x60, confidence: inferred, sources: [research], note: "hknpShapeInstance array (0x80 each): rotation rows +0x00/+0x10/+0x20 (unit), translation +0x30, scale +0x40, shape +0x50 (0x143f50740 builds the scaled transform)." }
  - { name: ShapeInstance_Size, value: 0x80, confidence: inferred, sources: [research] }
  - { name: ShapeInstance_Scale, value: 0x40, confidence: inferred, sources: [research] }
  - { name: ClientStaticModelGroup_Members, value: 0xe0, confidence: inferred, sources: [research], note: "Array of render blocks, one per member (0x130 each); count is the i32 at +0xec." }
  - { name: ClientStaticModelGroup_MemberCount, value: 0xec, confidence: inferred, sources: [research] }
  - { name: GroupMemberBlock_Size, value: 0x130, confidence: inferred, sources: [research], note: "+0x18 StaticModelGroupMemberData*, +0x20 physics component, +0xc8 render objects (or null: asked from the component, vtable +0x210), +0x120 active (u8)." }
  - { name: GroupMemberBlock_Member, value: 0x18, confidence: inferred, sources: [research] }
  - { name: GroupMemberBlock_Active, value: 0x120, confidence: inferred, sources: [research] }
  - { name: SpatialEntity_vf_transformChanged, value: 0xe0, confidence: inferred, sources: [research], note: "Called by SpatialEntity_setTransform when the entity's NotifyTransform flag is set; the client static model group's (0x143193690) re-places every member's render objects from InstanceTransforms or, when there are none, from the physics part transforms." }
