  - name: PhysicsWorld_create
    va: 0x1434e4da0
    signature: "void*(void* world, void* desc)"
    note: >-
      Makes a physics world (0xBB0 bytes; client, server and the client's effect world) and its
      hknpWorld (0x1434d0ff0) from a description: bodies desc +0x64 (+1), motions +0x68,
      constraints +0x6c, broadphase +0x40, gravity +0x50. The body count also sizes the game's
      16-bit record table. It connects the buffer-full signals: constraints grow (0x1434f3010),
      bodies and motions get an empty stub, so a full body buffer makes Havok write past it.
      From the cinematic tools' research (Research_Havok_2026-10-25); checked in Ghidra 2026-11-03.
    confidence: confirmed
    sources: [research, ghidra]
  - name: PhysicsWorld_flush
    va: 0x1434f4c80
    signature: "void(void* world)"
    note: >-
      The game's deferred physics work for one PhysicsWorld: each record put off is released, its slot
      at +0x130 cleared and pushed on the free list (+0x150 head, +0x152 live count), then its Havok
      bodies destroyed (destroyBodies 0x143f423e0 at 0x1434f4e91). The only place records die. Realm
      at [world +8] +0x10 (0 client); +0xb84 1 for the client's effect world. Research_Ground_Level
      2026-11-01 section 10.1; checked in Ghidra 2026-11-03.
    confidence: confirmed
    sources: [research, ghidra]
