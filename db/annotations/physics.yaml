# Physics: ray casts, and how a physics entity's collision follows its transform.
defaults: { confidence: confirmed, sources: [mecmp] }

globals:
  - { name: TI_PhysicsEntityFactory, va: 0x142831670, type: "void*", note: "fb::TI_PhysicsEntityFactory, the type the game world's factory list (+0x58) is searched for (PhysicsFactory_find) when a barrier makes its body.", confidence: inferred, sources: [ghidra] }
  - name: HavokAabb6Step
    va: 0x1425a8e10
    type: f32
    note: "The 6-byte AABB codec's step factor (a child box's step = parent size * this; 1/226 in Havok)."
    confidence: inferred
    sources: [ghidra]

structs:
  - name: RaycastQuery
    size: 0x30
    align: 16
    note: What the caster reads (MOVAPS, 16-byte aligned). A radius above ~0 makes it a sphere sweep.
    members:
      - { offset: 0x00, name: from, type: "f32[4]" }
      - { offset: 0x10, name: to, type: "f32[4]" }
      - { offset: 0x20, name: radius, type: f32 }
      - { offset: 0x24, name: flags, type: "u8[3]", note: "Set by the entity's query builder (0x143a22330); not read by the caster." }
  - name: RaycastResult
    size: 0x40
    align: 16
    note: "A miss: position = to, fraction = 1, distance = |to - from|, hit = 0."
    members:
      - { offset: 0x00, name: position, type: "f32[4]" }
      - { offset: 0x10, name: normal, type: "f32[4]" }
      - { offset: 0x20, name: id, type: u32 }
      - { offset: 0x24, name: fraction, type: f32 }
      - { offset: 0x28, name: distance, type: f32 }
      - { offset: 0x2c, name: hit, type: u8 }
      - { offset: 0x30, name: tail, type: u16, note: "Always 0x0101." }
  - name: PhysicsRayInput
    size: 0xd0
    align: 16
    confidence: inferred
    sources: [research]
    note: >-
      What Physics_castRay reads, as RaycastQuery_execute builds it on its stack. The ignore list is an
      inline vector of body ids (begin = end = inline, capacity end = from).
    members:
      - { offset: 0x00, name: wants, type: u32, note: "Bits: 1 material, 2 part, 4 bone. The body id is filled in always." }
      - { offset: 0x08, name: filter, type: u32, note: "Collision filter; 9 for a plain ray." }
      - { offset: 0x10, name: ignoreBegin, type: "u32*" }
      - { offset: 0x18, name: ignoreEnd, type: "u32*" }
      - { offset: 0x20, name: ignoreCapacityEnd, type: "u32*" }
      - { offset: 0x30, name: ignoreInline, type: "u32[12]" }
      - { offset: 0x60, name: from, type: "f32[4]" }
      - { offset: 0x70, name: to, type: "f32[4]" }
      - { offset: 0x80, name: sweep, type: u8, note: "0 for a ray." }
  - name: PhysicsRayHit
    size: 0x50
    align: 16
    confidence: inferred
    sources: [research]
    note: "Initialised by the caller to body -1, material -1, part -1 (RaycastQuery_execute)."
    members:
      - { offset: 0x00, name: body, type: u32, note: "Packed from the Havok body's user data; the low 16 bits index the physics owner's object table (Physics_Owner, PhysicsOwner_Objects)." }
      - { offset: 0x08, name: material, type: u32 }
      - { offset: 0x0c, name: part, type: u32 }
      - { offset: 0x10, name: bone, type: u32 }
      - { offset: 0x18, name: fraction, type: f32 }
      - { offset: 0x20, name: normal, type: "f32[4]" }
      - { offset: 0x30, name: position, type: "f32[4]" }
      - { offset: 0x40, name: valid, type: u8 }

functions:
  # From MECMP's player collision (docs/PLAYER_OPTIONS.md, 2026-10-16); not checked here yet.
  - { name: PhysicsEntityFactory_create, va: 0x1435169e0, note: "Body factory; MECMP makes native Havok boxes (shape type 1, half-extents at +0x20, body kind 2 at +0x14) through it.", confidence: hypothesis, sources: [mecmp] }
  - { name: PhysicsCreationInfo_ctor, va: 0x142d4d1a0, note: "Owner entity bus at +0x28.", confidence: hypothesis, sources: [mecmp] }
  - { name: RigidBody_setTransformNative, va: 0x1434f8930, signature: "void(void* owner, u32* id, const LinearTransform* t, bool a4)", note: "Owner object table[id & 0xffff] vtable +0x178 (RigidBody_vf_setTransform) then 0x1434f38e0(owner, id). A barrier's enable calls it with 1 after RigidBody_transformSource.", confidence: inferred, sources: [mecmp, ghidra] }
  - { name: RigidBody_transformSource, va: 0x1434f6d90, signature: "void(void* owner, u32* id, const LinearTransform* t)", note: "Owner object table[id & 0xffff] vtable +0x250 with the transform.", confidence: inferred, sources: [mecmp, ghidra] }
  - { name: PhysicsManager_ownerOf, va: 0x1434ee790, signature: "void*(void* manager, u32* id)", note: "manager +0xf0 [(id >> 16) & 0xff]. The manager is a game world's +0x50.", confidence: inferred, sources: [ghidra] }
  - { name: PamOBBCollision_enable, va: 0x143333310, signature: "void(void* collision)", note: "Builds the barrier's body (HalfExtents, PhysicsBodies) once (id at +0x90), resolves its world transform (0x143165bc0, kept at +0x50), places the body (RigidBody_transformSource, RigidBody_setTransformNative), adds it to the world; +0x95 = 1. See docs/research/barriers-and-magropes.md.", confidence: inferred, sources: [ghidra] }
  - { name: PamOBBCollision_enableClient, va: 0x143333590, signature: "void(void* collision)", note: "The client barrier's enable (its init calls it): the same steps as PamOBBCollision_enable, the world from the entity's realm (flags +0x18 & 1). Read 2026-11-04 for the trainer's movement blockers off.", confidence: inferred, sources: [ghidra] }
  - { name: PamOBBCollision_disable, va: 0x143335ff0, signature: "void(void* collision)", note: "+0x95 = 0, takes the body out of the world (0x1434f6610, 0x1434f65f0).", confidence: inferred, sources: [ghidra] }
  - { name: PamOBBCollision_deinit, va: 0x143335b30, signature: "void(void* collision)", note: "Vtable +0x88: disables if enabled, destroys the body (0x1434eba50(owner, id, {realm, 1})), then the base deinit 0x143168770.", confidence: inferred, sources: [ghidra] }
  - { name: Entity_resolveTransform, va: 0x143165bc0, signature: "LinearTransform*(void* data, LinearTransform* out, void* bus)", note: "A data's Transform through its bus's property context (blueprint parents applied).", confidence: inferred, sources: [ghidra] }
  - name: PhysicsWorld_create
    va: 0x1434e4da0
    signature: "void*(void* world, void* desc)"
    note: >-
      Makes a physics world (0xBB0 bytes; client, server and the client's effect world) and its
      hknpWorld (0x1434d0ff0) from a description: bodies desc +0x64 (+1), motions +0x68,
      constraints +0x6c, broadphase +0x40, gravity +0x50. The body count also sizes the game's
      16-bit record table. It connects the buffer-full signals: constraints grow (0x1434f3010),
      bodies and motions get an empty stub, so a full body buffer makes Havok write past it.
      From the cinematic tools' research (Research_Havok_2026-10-25); checked in Ghidra 2026-11-03.
    confidence: confirmed
    sources: [research, ghidra]
  - name: PhysicsWorld_flush
    va: 0x1434f4c80
    signature: "void(void* world)"
    note: >-
      The game's deferred physics work for one PhysicsWorld: each record put off is released, its slot
      at +0x130 cleared and pushed on the free list (+0x150 head, +0x152 live count), then its Havok
      bodies destroyed (destroyBodies 0x143f423e0 at 0x1434f4e91). The only place records die. Realm
      at [world +8] +0x10 (0 client); +0xb84 1 for the client's effect world. Research_Ground_Level
      2026-11-01 section 10.1; checked in Ghidra 2026-11-03.
    confidence: confirmed
    sources: [research, ghidra]
  - { name: hknpConvexShape_BuildConfig_ctor, va: 0x143f2e490, signature: "void*(void* config)", note: "Havok's convex BuildConfig (0x30 bytes on the game's stack in 0x143516450).", confidence: confirmed, sources: [research, ghidra] }
  - { name: hknpConvexShape_createFromHalfExtents, va: 0x143f2f140, signature: "void*(const hkVector4* halfExtents, float convexRadius, const void* config)", note: "A box; the game uses radius 0.01 (0x143516450, kind 1) and sets the shape's user data (+0x18).", confidence: confirmed, sources: [research, ghidra] }
  - { name: hknpBodyCinfo_ctor, va: 0x143f38a70, signature: "void(void* cinfo)", note: "0x60 bytes: +0 shape, +8 reserved id, +0xc motion id (0 static), +0x10 quality, +0x12 material, +0x14 collision filter info, +0x18 flags, +0x30 position, +0x40 orientation (quaternion).", confidence: confirmed, sources: [research, ghidra] }
  - { name: hknpWorld_createBody, va: 0x143f41880, signature: "void(void* hknpWorld, u32* outId, const void* cinfo, u8 flags)", note: "Flags bit 0: don't add it yet (the game's factory 0x143516450 passes 1 and sets the body's user data +0x88 first); otherwise addBodies(world, id, 1, flags) at 0x143f41a38.", confidence: confirmed, sources: [research, ghidra] }
  - { name: hknpWorld_addBodies, va: 0x143f41a80, signature: "void(void* hknpWorld, const u32* ids, i32 count, u32 flags)", confidence: inferred, sources: [research, ghidra] }
  - { name: hknpWorld_destroyBodies, va: 0x143f423e0, signature: "void(void* hknpWorld, const u32* ids, i32 count, i32 a4)", note: "The game passes 1 (PhysicsWorld_flush).", confidence: confirmed, sources: [research, ghidra] }
  - { name: hknpWorld_setBodyTransform, va: 0x143f3a6b0, signature: "void(void* hknpWorld, u32 id, const hkTransform* t, i32 activation)", note: "RigidBody's setTransform (0x1434f21e0) passes 1, with t from hkTransform_fromQuat.", confidence: confirmed, sources: [research, ghidra] }
  - name: hknpWorld_setBodyVelocity
    va: 0x143f3af60
    signature: "void(void* hknpWorld, u32 id, const hkVector4* linear, const hkVector4* angular)"
    note: >-
      Dynamic bodies only (flags & 2): writes the motion's linear velocity (+0x40, world) and its
      angular velocity (+0x50, in the motion's own frame: the world value rotated by the inverse of
      its orientation +0x10), wakes it (0x143f43fa0) and tells the listeners. RigidBody's setTransform
      calls it with zeros for a dynamic body. Checked in Ghidra 2026-11-04.
    confidence: confirmed
    sources: [ghidra]
  - { name: Quat_fromLinearTransform, va: 0x143ccbd50, signature: "void(float* quat, const LinearTransform* t)", note: "The game's rows (w 0, translation w 1) to a rotation quaternion (0x1434f21e0).", confidence: inferred, sources: [ghidra] }
  - { name: hkTransform_fromQuat, va: 0x143cd0790, signature: "void(float* hkTransform, const float* quat)", note: "Fills the rotation; the caller writes the translation at +0x30 (0x1434f21e0).", confidence: inferred, sources: [ghidra] }
  - { name: PhysicsFactory_find, va: 0x143506830, signature: "void*(void* factories, const void* typeInfo)", note: "The first factory in a game world's list (+0x58; vector at +0x28..+0x30) whose type matches. A barrier's enable calls it with TI_PhysicsEntityFactory.", confidence: inferred, sources: [ghidra] }
  - { name: PhysicsEntityFactory_createBody, va: 0x143516450, signature: "void(void* factory, u32* outId, PhysicsCreationInfo* info, void* rigidData, void* desc)", note: "What PhysicsEntityFactory_create (a 32-byte stub) jumps to. Reads rigidData +0xd4, +0xd8, +0xdc..+0xe4 and info +0xc0 (the physics owner) / +0xc8 (parent); keeps neither rigidData nor desc.", confidence: inferred, sources: [ghidra] }
  - { name: RigidBody_destroy, va: 0x1434eba50, signature: "void(void* owner, u32* id, const u32* args)", note: "The barrier's deinit (PamOBBCollision_deinit) passes {realm, 1}: the owner's object (table +0x130) is destroyed.", confidence: inferred, sources: [ghidra] }
  - { name: RigidBody_enable, va: 0x1434e90f0, confidence: hypothesis, sources: [mecmp] }
  - { name: RigidBody_registerSpatial, va: 0x1434e9270, confidence: hypothesis, sources: [mecmp] }
  - { name: RigidBody_unregisterSpatial, va: 0x1434f6610, confidence: hypothesis, sources: [mecmp] }
  - { name: RigidBody_disable, va: 0x1434f65f0, confidence: hypothesis, sources: [mecmp] }
  - { name: RigidBody_destroyDeferred, va: 0x1434f5550, confidence: hypothesis, sources: [mecmp] }
  - name: RaycastQuery_execute
    va: 0x143a24890
    signature: "void(const RaycastQuery* query, void* world, void* physics, RaycastResult* result)"
    note: >-
      The ray caster behind the game's ray cast entities (ServerRaycastEntity). world is unused.
      Physics: ServerGameWorld+0x50 -> +0xf0 -> +0x18 (getter 0x1434ee940). A plain ray goes on to
      0x1434e27f0 with collision filter 9.
