# Physics: ray casts, and how a physics entity's collision follows its transform.
defaults: { confidence: confirmed, sources: [mecmp] }

globals:
  - { name: TI_PhysicsEntityFactory, va: 0x142831670, type: "void*", note: "fb::TI_PhysicsEntityFactory, the type the game world's factory list (+0x58) is searched for (PhysicsFactory_find) when a barrier makes its body.", confidence: inferred, sources: [ghidra] }
  - { name: TI_PamOBBCollisionEntity, va: 0x142858650, type: "void*", note: "fb::TI_PamOBBCollisionEntity (classId 1001 at +0x28). Checked by SurfaceTouch_classifyBody (0x143913840).", confidence: hypothesis, sources: [ghidra] }
  - { name: TI_ClientCapsuleCollisionComponent, va: 0x1427bd350, type: "void*", note: "fb::TI_ClientCapsuleCollisionComponent (classId at +0x28: 0x1427bd378). SurfaceTouch_classifyBody returns 0x1e without data lookup if parent is a capsule collision component.", confidence: hypothesis, sources: [ghidra] }
  - name: HavokAabb6Step
    va: 0x1425a8e10
    type: f32
    note: "The 6-byte AABB codec's step factor (a child box's step = parent size * this; exactly 1/226.0 = 0.0044247787f at 0x1425a8e10). Confirmed in Ghidra."
    confidence: hypothesis
    sources: [ghidra]

structs:
  - name: hknpMotion
    size: 0x80
    align: 16
    confidence: hypothesis
    sources: [ghidra, research]
    note: "Havok 2013 motion state (stride 0x80 in hknpWorld::m_motions at world + 0xe0). Contains center of mass, orientation quaternion, half-float inverse inertia/mass, linear velocity, and angular velocity in the local principal inertia frame."
    members:
      - { confidence: hypothesis, offset: 0x00, name: centerOfMass, type: "f32[4]", note: "Center of mass in world space." }
      - { confidence: hypothesis, offset: 0x10, name: orientation, type: "f32[4]", note: "Orientation quaternion (qx, qy, qz, qw) of the principal inertia frame." }
      - { confidence: hypothesis, offset: 0x20, name: invInertiaAndMass, type: "u16[4]", note: "16-bit half-float diagonal inverse inertia (Ixx^-1, Iyy^-1, Izz^-1) and inverse mass (1/m at +0x26)." }
      - { confidence: hypothesis, offset: 0x28, name: firstAttachedBodyId, type: u32, note: "Head of the linked list of bodies sharing this motion." }
      - { confidence: hypothesis, offset: 0x38, name: expansionLookAhead, type: u16, note: "Expansion radius / lookahead distance for continuous collision detection." }
      - { confidence: hypothesis, offset: 0x3a, name: dampingVelocityFactor, type: u16, note: "Velocity damping factor." }
      - { confidence: hypothesis, offset: 0x40, name: linearVelocity, type: "f32[4]", note: "World-space linear velocity vector (vx, vy, vz, 0)." }
      - { confidence: hypothesis, offset: 0x50, name: angularVelocity, type: "f32[4]", note: "Angular velocity vector (wx, wy, wz, 0) rotated into the local principal inertia frame." }
  - name: hknpBody
    size: 0x90
    align: 16
    confidence: hypothesis
    sources: [ghidra, research]
    note: "Havok 2013 rigid body record (stride 0x90 in hknpWorld::m_bodies at world + 0x20). Links a collision shape with a transform, collision filter, and motion record."
    members:
      - { confidence: hypothesis, offset: 0x00, name: transform, type: "f32[16]", note: "4x4 affine transform matrix (Right, Up, Forward, Translation)." }
      - { confidence: hypothesis, offset: 0x50, name: shape, type: "void*", note: "Pointer to hknpShape (box, sphere, capsule, convex, composite)." }
      - { confidence: hypothesis, offset: 0x58, name: flags, type: u32, note: "Bit 0: static, Bit 1: dynamic, Bit 2: hasMass, Bit 3: active in simulation." }
      - { confidence: hypothesis, offset: 0x5c, name: collisionFilterInfo, type: u32, note: "Havok collision filter layer / mask." }
      - { confidence: hypothesis, offset: 0x60, name: bodyId, type: u32, note: "Index of this body in the world body pool." }
      - { confidence: hypothesis, offset: 0x64, name: nextAttachedBodyId, type: u32, note: "Next body in the linked list sharing the same motion." }
      - { confidence: hypothesis, offset: 0x68, name: motionId, type: u32, note: "Index into hknpWorld::m_motions (0 if static)." }
      - { confidence: hypothesis, offset: 0x6e, name: motionType, type: u8, note: "1 = static, 2 = dynamic, 5 = keyframed." }
      - { confidence: hypothesis, offset: 0x70, name: simulationIslandId, type: i32, note: "Active simulation island index (-1 if deactivated/sleeping)." }
      - { confidence: hypothesis, offset: 0x88, name: userData, type: u64, note: "User data pointer (Frostbite PhysicsEntity/PhysicsBody wrapper)." }
  - name: hknpContactImpulseEvent
    size: 0x40
    align: 16
    confidence: hypothesis
    sources: [ghidra, research]
    note: "Havok 2013 contact impulse event dispatched via hkSignal2. Unpacked via hknpContactImpulseEvent_unpack (0x143f3ddf0) into contact normal and up to 4 contact manifold points."
    members:
      - { confidence: hypothesis, offset: 0x08, name: bodyIdA, type: u32, note: "First colliding body ID." }
      - { confidence: hypothesis, offset: 0x0c, name: bodyIdB, type: u32, note: "Second colliding body ID." }
      - { confidence: hypothesis, offset: 0x10, name: manifold, type: "void*", note: "Pointer to compressed contact manifold." }
      - { confidence: hypothesis, offset: 0x20, name: status, type: u8, note: "Contact status: 0 = NONE, 1 = STARTED, 2 = FINISHED, 3 = CONTINUED." }
      - { confidence: hypothesis, offset: 0x30, name: impulses, type: "f32[4]", note: "Impulse magnitudes along contact normal and friction directions." }
  - name: RaycastQuery
    size: 0x30
    align: 16
    note: What the caster reads (MOVAPS, 16-byte aligned). A radius above ~0 makes it a sphere sweep.
    members:
      - { offset: 0x00, name: from, type: "f32[4]" }
      - { offset: 0x10, name: to, type: "f32[4]" }
      - { offset: 0x20, name: radius, type: f32 }
      - { offset: 0x24, name: flags, type: "u8[3]", note: "Set by the entity's query builder (0x143a22330); not read by the caster." }
  - name: RaycastResult
    size: 0x40
    align: 16
    note: "A miss: position = to, fraction = 1, distance = |to - from|, hit = 0."
    members:
      - { offset: 0x00, name: position, type: "f32[4]" }
      - { offset: 0x10, name: normal, type: "f32[4]" }
      - { offset: 0x20, name: id, type: u32 }
      - { offset: 0x24, name: fraction, type: f32 }
      - { offset: 0x28, name: distance, type: f32 }
      - { offset: 0x2c, name: hit, type: u8 }
      - { offset: 0x30, name: tail, type: u16, note: "Always 0x0101." }
  - name: PhysicsRayInput
    size: 0xd0
    align: 16
    confidence: inferred
    sources: [research]
    note: >-
      What Physics_castRay reads, as RaycastQuery_execute builds it on its stack. The ignore list is an
      inline vector of body ids (begin = end = inline, capacity end = from).
    members:
      - { offset: 0x00, name: wants, type: u32, note: "Bits: 1 material, 2 part, 4 bone. The body id is filled in always." }
      - { offset: 0x08, name: filter, type: u32, note: "Collision filter; 9 for a plain ray." }
      - { offset: 0x10, name: ignoreBegin, type: "u32*" }
      - { offset: 0x18, name: ignoreEnd, type: "u32*" }
      - { offset: 0x20, name: ignoreCapacityEnd, type: "u32*" }
      - { offset: 0x30, name: ignoreInline, type: "u32[12]" }
      - { offset: 0x60, name: from, type: "f32[4]" }
      - { offset: 0x70, name: to, type: "f32[4]" }
      - { offset: 0x80, name: sweep, type: u8, note: "0 for a ray." }
  - name: PhysicsRayHit
    size: 0x50
    align: 16
    confidence: inferred
    sources: [research]
    note: "Initialised by the caller to body -1, material -1, part -1 (RaycastQuery_execute)."
    members:
      - { offset: 0x00, name: body, type: u32, note: "Packed from the Havok body's user data; the low 16 bits index the physics owner's object table (Physics_Owner, PhysicsOwner_Objects)." }
      - { offset: 0x08, name: material, type: u32 }
      - { offset: 0x0c, name: part, type: u32 }
      - { offset: 0x10, name: bone, type: u32 }
      - { offset: 0x18, name: fraction, type: f32 }
      - { offset: 0x20, name: normal, type: "f32[4]" }
      - { offset: 0x30, name: position, type: "f32[4]" }
      - { offset: 0x40, name: valid, type: u8 }

