# Faith's movement, the input devices and the game state MEC_Trainer used, as GridNode found them
# with examples/probe (October 2026). Chains start from Faith (or a global) and each object on the
# way is checked where it has a known vtable or reflected type, so a wrong object reads as "not
# available" rather than garbage.
defaults: { confidence: confirmed, sources: [gridnode, mec-trainer] }

globals:
  - name: LocalClientCharacterPtr
    va: 0x142106a68
    type: "PamClientCharacterEntity*"
    note: Holds Faith on the client (MEC_Trainer's PlayerEntity base; probe-confirmed equal to local_client_character).
  - name: InputDevices
    va: 0x14256d7c0
    type: "InputDevices*"
    note: The PC input devices (constructor 0x1437b7ba0, vtable 0x141c0d0e8). Mouse via vtable +0x40 (0x1437b92c0).
  - name: InMenu
    va: 0x1425946e4
    type: i32
    confidence: inferred
    note: Non-zero while a menu is up (MEC_Trainer; read/written by 0x143b39670 and 0x143b3a890).
  - name: LoadingWorldRenderSettings
    va: 0x14240c2b8
    type: "WorldRenderSettings*"
    confidence: inferred
    note: MEC_Trainer reads +0x4c1 of this WorldRenderSettings as "loading".
  - name: TimeOfDayManager
    va: 0x14255c2f8
    type: "void*"
    note: "+0x8 -> +0x28 = the ServerTimeOfDayClockEntity (checked by type); clock +0x30 = time of day in seconds (f32)."
  - name: SharedContentManagerHolder
    va: 0x14257e7c8
    type: "void*"
    note: "+0x28 = PamServerSharedContentManagerEntity (checked by type); +0x280 = content active (i32)."
  - name: DashState
    va: 0x14257c9d0
    type: "void*"
    confidence: inferred
    note: "+0xe0 = dash started (u8), MEC_Trainer."
  - name: AntMovementTuning
    va: 0x1423bd908
    type: "void*"
    note: ANT runtime (freed by 0x142c3c590). "+0x408 -> +0x380 -> run tuning block (+0x1c40.. floats)."
  - name: AntAssetDatabase
    va: 0x1423dd0b8
    type: "void*"
    note: ANT asset database, created after AntSettings by 0x142fbe900. Movement tuning assets hang off it.
  - name: JumpTuningRoot
    va: 0x142105510
    type: "void*"
    note: "+0xa48 = PamCharacterBlueprint; +0x120 -> jump tuning (+0x648..+0x8b4 floats)."

structs:
  - name: InputDevices
    size: 0x2000
    opaque: true
    members:
      - { offset: 0x1a78, name: keyboardBytes, type: "u8[256]", note: "One byte per InputDeviceKeys value (DirectInput-style buffer)." }
      - { offset: 0x1acc, name: keyboardKeys, type: "i32[256]", note: "Key state per InputDeviceKeys value; 1 = down. Writing it presses the key as far as the game is concerned (IDK_Space 57 -> +0x1bb0; MEC_Trainer's jump trigger)." }
  - name: PamMovement
    size: 0x30
    opaque: true
    confidence: inferred
    note: "Not a reflected type; reached from PamClientCharacterEntity.movementOwner +0x48 -> +0."
    members:
      - { offset: 0x20, name: ground, type: "void*", note: "+0x4 last ground Y (f32), +0x17 on ground (u8)." }
      - { offset: 0x28, name: state, type: "void*", note: "+0x18 wall count, +0x38 wall climbs, +0x3c wall runs, +0x90 movement state (all i32)." }

constants:
  - { name: InputDevices_Vtable, value: 0x141c0d0e8 }
  - { name: Keyboard_Bytes, value: 0x1a78 }
  - { name: Keyboard_Keys, value: 0x1acc }
  - { name: Character_PhysicsHolder, value: 0x28 }
  - { name: Character_MovementOwner, value: 0xb0 }
  - { name: Character_Camera, value: 0x250 }
  - { name: Camera_Forward, value: 0x70 }
  - { name: MovementOwner_Movement, value: 0x48 }
  - { name: Movement_Ground, value: 0x20 }
  - { name: Movement_State, value: 0x28 }
  - { name: Ground_LastY, value: 0x4 }
  - { name: Ground_OnGround, value: 0x17 }
  - { name: State_WallCount, value: 0x18 }
  - { name: State_WallClimbs, value: 0x38 }
  - { name: State_WallRuns, value: 0x3c }
  - { name: State_Movement, value: 0x90 }
  - { name: PhysicsHolder_Body, value: 0x1f0 }
  - { name: Body_Motion, value: 0x10 }
  - { name: Motion_Speed, value: 0x438 }
  - { name: TimeOfDay_Clock1, value: 0x8 }
  - { name: TimeOfDay_Clock2, value: 0x28 }
  - { name: Clock_Time, value: 0x30 }
  - { name: SharedContent_Manager, value: 0x28 }
  - { name: SharedContent_Active, value: 0x280 }
  - { name: Dash_Started, value: 0xe0 }
  - { name: Loading_Flag, value: 0x4c1 }
  - { name: HealthComponent_ImmortalProperty, value: 0xc0 }
  - { name: Character_AnimatableOwner, value: 0xd0 }
  - { name: AnimatableOwner_Animatable, value: 0x128 }
  - { name: Animatable_Pose, value: 0x30 }
  - { name: Pose_Position, value: 0x50 }
