  - name: EntryInputState_set
    va: 0x143301620
    signature: "void(EntryInputState* state, u32 actionHash, f32 value)"
    confidence: inferred
    sources: [gridnode]
    note: Digital actions are set when value >= 1.
  - name: ClientPlayer_overrideInputState
    va: 0x143203d50
    signature: "EntryInputState*(void* clientPlayer)"
    confidence: inferred
    sources: [gridnode]
    note: Returns ClientPlayer +0x14c0, making it (poolAlloc 0x530 + 0x1432f8aa0) the first time; sets flag 0x20 in +0x1520.
  - name: PamClientAntInput_processCharacter
    va: 0x14391b970
    signature: "void(i64* character, void* inputState, f32 dt, f32 scale)"
    confidence: inferred
    sources: [gridnode, ghidra]
    note: "Per character: reads the move and look actions (analog) and the button actions (digital) and hands them to the ANT input (0x142b8a7a0, 0x142bc5540). Named in Ghidra; first GridNodeSync round trip. The buttons go in as held / not held (a 0x100-byte block copied into ANT each tick; jump 0xb5a0a981 is its byte +0x39): ANT's graph makes its own presses from them, so a jump press made in the air is spent there (bhops, 2026-10-30)."
  - name: PamClientAntInputComponent_onInput
    va: 0x143911c80
    signature: "void(void* inputListener, EntryInputState* state, void* player)"
    confidence: inferred
    sources: [gridnode]
    note: >-
      inputListener is the component +0x38. Feeds the player's input to the animation system (ANT). Copies the state; when ClientPlayer
      +0x1520 has flag 0x40 it uses ClientPlayer +0x14c0 (0x143203d50 makes it) instead. Per
      character it calls 0x14391b970, which reads the movement actions: analog 0x1dcfd4cd/cc
      (move), 0x436f6516/17 (look), digital 0x2884e120..0x2884e136, 0x578abcc, 0xb5adb0e5,
      0xb5a0a981 (buttons, one of them jump) into the ANT input (0x142bc5540).
