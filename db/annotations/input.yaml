# Input actions (2026-10-20, Ghidra; probe F12 confirms the registry layout). The game turns keys
# into actions in an EntryInputState; consumers read actions by a 32-bit hash, so an action is the
# same whatever key the player bound to it.
structs:
  - name: EntryInputActionRegistry
    size: 0xb0
    opaque: true
    confidence: inferred
    sources: [gridnode]
    note: Set by 0x1432fd340, which copies its counts into the globals at 0x1424aa1a8..0x1424aa1bc.
    members:
      - { offset: 0x10, name: buckets, type: "void*", note: "Hash map buckets; node {u32 hash, u32 index, next at +8}; the sentinel is buckets[bucketCount]." }
      - { offset: 0x18, name: bucketCount, type: u32 }
      - { offset: 0x94, name: analogCount, type: u32, note: "Indices below are analog (floats)." }
      - { offset: 0x98, name: digitalFirst, type: u32, note: "Digital index i is bit (i - digitalFirst) of EntryInputState.digitalBits." }
      - { offset: 0xa4, name: end, type: u32 }
  - name: EntryInputState
    size: 0x530
    opaque: true
    confidence: inferred
    sources: [gridnode]
    note: "Constructed by 0x1432f8aa0. Read an action: 0x1432fc490 (float) / 0x1432fc330 (digital); set: 0x143301620."
    members:
      - { offset: 0x350, name: analog, type: "f32[6]", note: "One float per analog action: 6 in Catalyst (the registry's analogCount). The constructor clears 0x350..0x530." }
      - { offset: 0x4b8, name: digitalBits, type: u64 }
      - { offset: 0x4e0, name: analogScale, type: f32, sources: [gridnode, ghidra], note: "Set to 1.0 by the constructor (0x143300860)." }
      - { offset: 0x52c, name: lastAction, type: i32, sources: [gridnode, ghidra], note: "Set to -1 by the constructor (0x143300860)." }

functions:
  - name: EntryInputState_getAnalog
    va: 0x1432fc490
    signature: "f32(EntryInputState* state, u32 actionHash)"
