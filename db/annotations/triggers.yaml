# Area triggers: their geometry cache and the shapes in it (docs/research/trigger-volumes.md).
defaults: { confidence: inferred, sources: [ghidra] }

functions:
  - name: KillVolume_testCharacter
    va: 0x143970d30
    signature: "bool(void* killVolume, void* character)"
    note: >-
      A kill volume's test of one character: the character's box centre (its vtable +0xb8) into the
      volume's shape test (0x14330d320 with the volume's shape cache +0x38 and its bus), whose answer
      (al: inside) it passes on; the caller kills a character inside. Ghidra shows both as void: they
      return al (a void stand-in killed Faith at once, 2026-11-04). Returning false spares it (the cinematic tools' Solid street,
      Research_Ground_Level_2026-11-01 section 9). Checked in Ghidra 2026-11-04.
    confidence: confirmed
    sources: [research, ghidra]
  - name: areaTriggerGeometry_contains
    va: 0x14330d320
    signature: "bool(void* cache, void* dataAndField, void* busInterface, const f32* position)"
    note: "Whether a world position is inside a trigger's geometry cache: by its kind (+0x20) applies the transform(s) at +0x10 (world to local; kind 2 without one uses the bus's), checks the bounding circle (+0x00 x, +0x04 z, +0x18 radius squared), then each shape at +0x08 with shape_containsPoint. Kind 4 looks the shapes up each time (0x143124f50)."
    sources: [ghidra, research]
  - name: areaTriggerGeometry_build
    va: 0x14330bac0
    signature: "void(void* cache, void* dataAndField, void* busInterface)"
    note: "Fills a geometry cache from the data's linked shapes ({data, 0x31fb3b9f 'Geometry'}). PamServerAreaTriggerEntity's vf15 builds two: +0x1b8 (tested) and +0x70."
  - name: PamServerAreaTriggerEntity_update
    va: 0x14395c750
    signature: "void(void* trigger, void* tickInfo)"
    note: >-
      The area-trigger system's per-tick update (trigger-events topic, Ghidra 2026-11-12). Runs the
      updater at +0xa8 (the character gather, 0x14395de40), then per registered trigger (+0x28..+0x30,
      16-byte entries with an interval counter): initialized (+0x18 bit 3), interval, enabled (+0x60).
      Candidates into +0xa0 (0x143956e20, else 0x143956910 from the global lists), the overlap test
      0x143956a70 into +0xe8, then enter, leave (either stops the rest when data+0x64 RunOnce is set),
      inside (when +0x150 != 0), 0x14395fc60.
  - name: PamServerAreaTriggerEntity_testOverlap
    va: 0x143956a70
    signature: "void(void* trigger, void* candidates, void* outInside)"
    note: >-
      Fills outInside with the candidate characters in the volume. data+0xbc == 0: the box centre
      (character vtable +0xb8) through areaTriggerGeometry_contains with the cache at +0x70. Else each shape
      at +0x78 against the character's box with 0x143956360 (OBB test 0x142a69020). No physics phantom:
      the test is geometric (Ghidra 2026-11-12).
  - name: PamServerAreaTriggerEntity_fireEnter
    va: 0x143959420
    signature: "bool(void* trigger, void* insideNow)"
    note: "For each character now inside and not in the inside list (+0x130..+0x138, 16-byte {ref, f32 timer}): adds it and, unless data+0xbf (TriggerOnlyOnLeave), sends OnEnter (0xfb35ad6c) through AreaTrigger_sendEvent; an extended event (0x143395700) when the character has +0x250."
  - name: PamServerAreaTriggerEntity_fireLeave
    va: 0x143959930
    signature: "bool(void* trigger, void* insideNow)"
    note: "For each character in the inside list but not inside now: sends OnLeave (0xfbd34b3f) (when data+0xc1 or the character's +0x1f0 vtable[0]() is true) and removes it."
  - name: PamServerAreaTriggerEntity_fireInside
    va: 0x1439596a0
    signature: "void(void* trigger, f32 dt)"
    note: "OnInsideArea (0x935fd78f): with data+0xbe == 0 once per tick for each count of +0x150; else per inside entry, its timer (+0x8 of the entry) advanced by dt."
  - name: AreaTrigger_sendEvent
    va: 0x1433cabe0
    signature: "void(void* trigger, void* event)"
    note: "Fires a trigger's event: data+0x60 (Delay) <= 0 goes at once to EntityBus_fireEvent (via 0x14314e8a0); else queued with the delay. With data+0x64 (RunOnce) it first disables the trigger (+0x60 = 0) and sends OnDisabled (0xfc4bbbb4)."
  - name: AreaTrigger_onEvent
    va: 0x1433ca480
    signature: "void(void* trigger, void* event)"
    note: "Enable (0x8ba423e4) sets +0x60 and sends OnEnabled (0x9e88ca61); Disable (0xf90216b1) clears it and sends OnDisabled (0xfc4bbbb4); each only on a change."
  - name: shape_containsPoint
    va: 0x143427220
    signature: "bool(const f32* localPosition, void* shapeData)"
    note: "By the shape's type: SphereData (Position +0x20, Radius +0x18), AABBData (Position +0x20, HalfExtents +0x30), OBBData (0x143427610), VectorShapeData (vectorShape_containsPoint)."
  - name: vectorShape_containsPoint
    va: 0x1434274b0
    signature: "bool(const f32* localPosition, void* shapeData, bool ignoreHeight)"
    note: "An outline in x / z (Points +0x18, 0x10 apart, count at -4), crossing test; a VolumeVectorShapeData with Height (+0x28) > 0 also bounds y."

constants:
  - { name: PamServerAreaTriggerEntity_Geometry, value: 0x1b8, confidence: confirmed, sources: [ghidra, research], note: "The geometry cache tested each tick (drawn in game 2026-11-01). ServerAreaTriggerEntity keeps it at +0x1a8." }
  - { name: ServerAreaTriggerEntity_Geometry, value: 0x1a8, sources: [ghidra], note: "From its vf25 (0x1433c8230); none live in the city to check." }
  - { name: Entity_BusInterface, value: 0x20, confidence: confirmed, sources: [ghidra, research], note: "An entity's +0x20 is its bus's interface, the bus + 8 (EntityBus_fireEvent's bus is 8 bytes before it; confirmed by reading the event connections, 2026-11-01)." }
  - { name: EntityBus_EventConnections, value: 0x68, confidence: confirmed, sources: [ghidra, research], note: "-> +0x120 (+0x148 when bus +0x3c bit 28): {begin, end} of pointers to 0x20-byte records {+0 source data, +8 target, +0x10 event, +0x14 target event, +0x18 kind}, sorted by source." }
